<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HuntManagement — Webbredigerare</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%8C%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --border: #d8d8d8;
    --bg: #ffffff;
    --bg-alt: #f6f6f4;
    --text: #1c1c1c;
    --muted: #6b6b6b;
    --accent: #2e5e3e;
    --accent-bg: #eaf2ec;
    --danger: #a6362c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg-alt);
  }
  header.top {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
  }
  header.top h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 600;
  }
  header.top .sub {
    color: var(--muted);
    font-size: 13px;
  }
  header.top .spacer { flex: 1; }
  .share-box {
    display: none;
    align-items: center;
    gap: 6px;
    width: 100%;
    order: 10;
    padding-top: 4px;
  }
  .share-box.visible { display: flex; }
  .share-box input {
    flex: 1;
    min-width: 120px;
    font-size: 12px;
  }
  .share-box .status {
    font-size: 12px;
    color: var(--accent);
    white-space: nowrap;
  }
  button, .btn {
    font: inherit;
    font-size: 13px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    color: var(--text);
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.small { padding: 3px 8px; font-size: 12px; }
  nav.tabs {
    display: flex;
    gap: 4px;
    padding: 10px 20px 0;
    background: var(--bg-alt);
    overflow-x: auto;
  }
  nav.tabs button { flex: none; white-space: nowrap; }
  nav.tabs button {
    border-radius: 8px 8px 0 0;
    border-bottom: none;
    background: var(--bg-alt);
    color: var(--muted);
  }
  nav.tabs button.active {
    background: var(--bg);
    color: var(--text);
    font-weight: 600;
  }
  main {
    padding: 20px;
    max-width: 980px;
    margin: 0 auto;
  }
  .panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0 8px 8px 8px;
    padding: 18px;
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }
  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px 16px;
    margin-bottom: 18px;
  }
  label.field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  input, select {
    font: inherit;
    font-size: 13px;
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--text);
  }
  .drive-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .drive-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-alt);
    padding: 8px 12px;
    flex-wrap: wrap;
  }
  .drive-card-header .drive-name {
    font-weight: 600;
    font-size: 14px;
    min-width: 140px;
  }
  .drive-card-header .pass-count {
    font-size: 12px;
    color: var(--muted);
    margin-right: -6px;
    white-space: nowrap;
  }
  .car-order-toolbar {
    display: flex;
    justify-content: flex-end;
    padding: 6px 12px 0;
  }
  .drive-card-header .rally {
    flex: 1;
    min-width: 180px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .drive-card-header .rally input { flex: 1; }
  table.assign {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.assign th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
  }
  table.assign td {
    padding: 5px 8px;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
  }
  table.assign input, table.assign select { width: 100%; }
  /* Hett (flame): a toggle in Förberedelse, a read-only mark in
     Passfördelning. Same width either way so columns stay put. */
  .field input:disabled { background: var(--bg-alt); color: var(--muted); cursor: not-allowed; opacity: 1; }
  .same-car-box { margin: 0 0 14px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-alt); }
  .same-car-box .sc-title { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .same-car-box .sc-list { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 8px; font-size: 13px; }
  .same-car-box .sc-list label { display: inline-flex; align-items: center; gap: 5px; }
  .same-car-box .sc-head { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .assignee-line { display: flex; align-items: center; gap: 6px; }
  .assignee-line select { flex: 1; min-width: 0; }
  .car-mismatch { color: #e8590c; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .attendee-daycar { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  .attendee-row .daycar-sel { width: auto; max-width: 180px; font-size: 12px; }
  .attendee-list.with-daycar { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
  .sort-btn {
    font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit;
    background: none; border: none; padding: 0; margin: 0; cursor: pointer;
  }
  .sort-btn:hover { color: var(--text); }
  .sort-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sort-ind { display: inline-block; width: 1.1em; margin-left: 2px; font-size: 9px; }
  .hot-cell { width: 1%; white-space: nowrap; text-align: center; }
  .hot-btn {
    background: none; border: none; padding: 2px; margin: 0; cursor: pointer;
    line-height: 0; border-radius: 4px; color: var(--muted); opacity: 0.55;
  }
  .hot-btn:hover { opacity: 1; }
  .hot-btn:focus-visible { outline: 2px solid var(--accent); }
  .hot-btn.on, .hot-btn.on:hover { color: #e8590c; opacity: 1; }
  .hot-mark { display: inline-block; line-height: 0; color: #e8590c; vertical-align: -2px; margin-left: 4px; }
  .hot-btn svg, .hot-mark svg { width: 20px; height: 20px; fill: currentColor; }
  .hot-btn:not(.on) svg { fill: none; stroke: currentColor; stroke-width: 1.6; }
  .post-label {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .post-edit-btn {
    font: inherit;
    font-variant-numeric: tabular-nums;
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    text-decoration: underline dotted;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .post-edit-btn:disabled {
    text-decoration: none;
    cursor: default;
    opacity: 1;
  }
  .post-edit-inline {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .post-edit-inline input.num { width: 46px; }
  .add-row {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 8px 12px;
    background: var(--bg-alt);
    flex-wrap: wrap;
  }
  .add-row input { width: 90px; }
  .add-row .tower-check { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text); }
  .add-row .tower-check input { width: auto; }
  .drive-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .drive-tabs button.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .readonly {
    color: var(--muted);
  }
  .attendee-box {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-alt);
    padding: 10px 12px;
    margin-bottom: 16px;
  }
  .attendee-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
  }
  .attendee-filter {
    width: 100%;
    margin: 8px 0;
  }
  .attendee-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 4px 10px;
    max-height: 220px;
    overflow-y: auto;
    padding-top: 4px;
  }
  .attendee-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .attendee-row input { width: auto; }
  table.assign [data-freeform] { margin-top: 4px; }
  #fileInput { display: none; }
  .more-wrap { position: relative; display: inline-block; }
  .more-menu {
    display: none;
    position: fixed;
    z-index: 60;
    min-width: 190px;
    max-width: calc(100vw - 16px);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    padding: 6px;
    flex-direction: column;
    gap: 4px;
  }
  .more-menu.open { display: flex; }
  .more-menu .btn { width: 100%; text-align: left; }
  .dropbox-status {
    display: none;
    width: 100%;
    order: 11;
    font-size: 12px;
    color: var(--muted);
  }
  .dropbox-status.visible { display: block; }
  .dropbox-status.ok { color: var(--accent); }
  .dropbox-status.warn { color: var(--danger); }
  .dropbox-banner {
    display: none;
    margin: 10px 20px 0;
    padding: 10px 14px;
    border: 1px solid #d9b44a;
    background: #fff7e0;
    border-radius: 8px;
    font-size: 13px;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .dropbox-banner.visible { display: flex; }
  .dropbox-banner .msg { flex: 1; min-width: 220px; }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin: -8px 0 16px;
  }

  /* --- Help (?) popovers --- */
  .help-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    padding: 0;
    margin: 0 0 0 5px;
    border: 1px solid var(--muted);
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    text-transform: none;
    letter-spacing: 0;
    vertical-align: middle;
    cursor: pointer;
  }
  .help-btn:hover, .help-btn:focus-visible, .help-btn[aria-expanded="true"] {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  #helpPop {
    position: absolute;
    z-index: 1000;
    display: none;
    box-sizing: border-box;
    width: 340px;
    max-width: calc(100vw - 16px);
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
    padding: 10px 12px 8px;
    font-size: 13px;
    line-height: 1.45;
    text-transform: none;
    letter-spacing: 0;
    font-weight: normal;
  }
  #helpPop h4 { margin: 0 0 6px; font-size: 13px; }
  #helpPop p { margin: 0 0 7px; }

  /* --- Report --- */
  #reportRoot {
    background: white;
    color: black;
    padding: 12px;
  }
  /* Location photo (package field locationImageDataURL): top-left of the
     Rapport header with the title centred on the photo's height. Only
     rendered when the package has a photo, so without one the header is
     exactly as before. */
  .report-header {
    position: relative;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #reportRoot .report-header h2 {
    margin: 0;
    padding: 0 64px;
    flex: 1 1 auto;
  }
  #reportRoot .report-header { margin-bottom: 14px; }
  .report-header .report-location-img {
    position: absolute;
    left: 0;
    top: 0;
    height: 56px;
    width: 56px;
    object-fit: contain;
  }
  /* No rule under the title any more (the drive headings carry the rules,
     so a title rule would be a fourth line competing with them): the title
     is just larger instead. */
  #reportRoot h2 {
    font-size: 26px;
    margin: 0 0 14px;
    text-align: center;
  }
  .report-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 20px;
  }
  .report-drive {
    margin-bottom: 14px;
    break-inside: avoid;
  }
  /* Three levels, told apart by KIND of emphasis rather than size (matches
     the native sheet): drive = larger + semibold + a rule across the block,
     car = italic only, rows = plain. The rule is a border on the heading
     itself, and the gap to the first car heading is shortened by the same
     3px (2px padding + 1px border), so the sheet is exactly as tall as
     before. A dark solid colour so printers don't drop it. */
  .report-drive h3 {
    font-size: 13px;
    margin: 0;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--accent);
  }
  .report-group h4 {
    font-size: 12px;
    font-style: italic;
    font-weight: 400;
    margin: 6px 0 2px;
  }
  .report-drive h3 + .report-group h4 { margin-top: 3px; }
  .report-row {
    display: flex;
    gap: 6px;
    font-size: 12px;
    padding: 1px 0;
  }
  /* Post column: never wraps. Its width is measured from the longest label
     when the report is built (fitReportPostColumn) so every row still lines
     up; 64px is only the fallback. */
  .report-row .rp { width: var(--rp-w, 64px); flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .report-row .rn { flex: 1; }
  .report-row .rc { color: #444; }

  @media (max-width: 600px) {
    main { padding: 12px; }
    nav.tabs { padding: 8px 12px 0; }
  }

  @media print {
    .no-print, .help-btn, #helpPop { display: none !important; }
    body { background: white; }
    main { padding: 0; max-width: none; }
    .panel { border: none; padding: 0; border-radius: 0; }
    @page { size: A4; margin: 12mm; }
  }
</style>
</head>
<body>

<header class="top no-print">
  <h1>HuntManagement</h1>
  <span class="sub" id="eventSummary">Ingen jaktdag inläst</span>
  <span class="spacer"></span>
  <input type="file" id="fileInput" accept="application/json">
  <button class="btn" id="openBtn">Öppna fil…</button>
  <button class="btn" id="shareLinkBtn" disabled>Dela länk…</button>
  <button class="btn" id="sendBackBtn" disabled>Skicka tillbaka…</button>
  <button class="btn" id="fetchLatestBtn" style="display:none" title="Hämtar den nyaste versionen från brevlådan">Hämta senaste</button>
  <button class="btn primary" id="saveBtn" disabled>Spara ändringar…</button>
  <span class="more-wrap" id="moreWrap" style="display:none">
    <button class="btn" id="moreBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu">Mer ▾</button>
    <div class="more-menu" id="moreMenu" role="menu"></div>
  </span>
  <button type="button" class="help-btn" data-help="sync" aria-label="Hjälp: spara, skicka och dela" title="Hjälp">?</button>
  <div class="share-box" id="shareBox">
    <input type="text" id="shareLinkInput" readonly>
    <span class="status" id="shareLinkStatus"></span>
    <button class="btn small" id="closeShareLinkBtn">Stäng</button>
  </div>
  <div class="dropbox-status" id="dropboxStatus"></div>
</header>

<div class="dropbox-banner no-print" id="dropboxBanner">
  <span class="msg" id="dropboxBannerMsg"></span>
  <button class="btn small" id="bannerSaveFileBtn">Spara mina ändringar som fil</button>
  <button class="btn small primary" id="bannerFetchBtn">Hämta senaste</button>
</div>

<nav class="tabs no-print" id="tabs">
  <button data-tab="setup" class="active">Förberedelse</button>
  <button data-tab="assign">Passfördelning</button>
  <button data-tab="report">Rapport</button>
  <button data-tab="mobile">Mobilrapport</button>
</nav>

<main>
  <div class="panel" id="app">
    <div class="empty-state">
      Öppna en exporterad jaktdags-fil (JSON) för att börja, eller ladda
      exempeldata: <button class="btn small" id="loadSampleBtn">öppna exempeldata</button>
    </div>
  </div>
</main>

<div id="helpPop" role="dialog" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  const ROLES = ["Hundförare", "Utställare"];

  /** @type {any} */
  let state = null;
  // editingPost: the exact Post object (a reference into state.posts, from
  // findPost — never a copy) currently shown as inline edit fields in the
  // Förberedelse tab, or null. Compared by identity (===), which stays
  // valid across a rename since editing only mutates the object's fields,
  // never replaces it.
  let ui = {
    tab: "setup",
    selectedEventDriveLocalId: null,
    editingPost: null,
    attendeeBoxOpen: false,
    attendeeFilter: "",
    // Passfördelning's clickable headers: view-only, never touches the data.
    // key: null (the file's own order) | "post" | "car"; dir: 1 | -1.
    assignSort: { key: null, dir: 1 },
  };

  // ---------- helpers ----------

  function uid(prefix) {
    return prefix + Math.random().toString(36).slice(2, 9);
  }

  function numberLabel(post) {
    return (post.postNumber || "") + (post.code || "");
  }

  function displayLabel(post) {
    let l = numberLabel(post);
    if (post.type) l += " (" + post.type + ")";
    return l;
  }

  // Report notation only (matches the native sheet's Post.reportLabel): a
  // tower post is written the way the hunt leader writes it, T110 / T6HS,
  // instead of "110 (T)". Other types keep the ordinary label. A number that
  // already starts with T (older, un-normalised names) isn't prefixed twice.
  function reportLabel(post) {
    const t = String(post.type || "").trim().toUpperCase();
    if (t === "T") {
      const n = numberLabel(post);
      return /^T/i.test(n) ? n : "T" + n;
    }
    return displayLabel(post);
  }

  function findPost(postNumber, postCode) {
    return state.posts.find(
      (p) => p.postNumber === postNumber && (p.code || "") === (postCode || "")
    );
  }

  // Rapport order inside one car: "Ordning i bil" first (lowest first), rows
  // without a number after all numbered ones, and ties (or no numbers at
  // all) fall back to the post number. Matches the app's own "by car" sort.
  function compareInCar(a, b) {
    const num = (v) => (v == null || v === "" || isNaN(Number(v)) ? null : Number(v));
    const oa = num(a.carOrder);
    const ob = num(b.carOrder);
    if (oa !== null && ob === null) return -1;
    if (oa === null && ob !== null) return 1;
    if (oa !== null && ob !== null && oa !== ob) return oa - ob;
    return comparePosts(a, b);
  }

  function comparePosts(a, b) {
    const pa = findPost(a.postNumber, a.postCode) || { postNumber: a.postNumber, code: a.postCode };
    const pb = findPost(b.postNumber, b.postCode) || { postNumber: b.postNumber, code: b.postCode };
    const na = parseFloat(pa.postNumber);
    const nb = parseFloat(pb.postNumber);
    const va = isNaN(na) ? Infinity : na;
    const vb = isNaN(nb) ? Infinity : nb;
    if (va !== vb) return va - vb;
    const ca = pa.code || "";
    const cb = pb.code || "";
    if (ca !== cb) return ca < cb ? -1 : 1;
    return 0;
  }

  function assignmentsForDrive(localId) {
    return state.postAssignments
      .filter((pa) => pa.eventDriveLocalId === localId)
      .sort((a, b) => a.sortOrder - b.sortOrder);
  }

  // "Sortera om bilordning" (Förberedelse tab) does two things:
  // 1. Renumbers carOrder to a clean 1, 2, 3… per car, using whatever order
  //    is currently there (missing values sort last, ties broken by the
  //    table's own row order) — a cleanup step after manually inserting
  //    someone with a fractional value like 2.1, not a way to choose the
  //    order itself. Assignments with no car set keep their carOrder,
  //    since "Ordning i bil" has no meaning without a car.
  // 2. Re-sorts the table's rows (rewrites sortOrder) to match: car by car
  //    (same car ordering as the Rapport), each car in its Ordning i bil,
  //    and the posts without a car last, in their existing order. Without
  //    this the button looked like it did nothing whenever the numbers were
  //    already clean. Rows only move when this button is pressed, never
  //    while typing, so they don't jump around mid-edit.
  function resortCarOrder(localId) {
    const rows = assignmentsForDrive(localId);
    const byCar = new Map();
    const noCar = [];
    rows.forEach((pa) => {
      const key = (pa.car || "").trim();
      if (!key) { noCar.push(pa); return; }
      if (!byCar.has(key)) byCar.set(key, []);
      byCar.get(key).push(pa);
    });
    const cars = [...byCar.keys()].sort((a, b) => a.localeCompare(b, "sv", { numeric: true }));
    const ordered = [];
    cars.forEach((key) => {
      const list = byCar.get(key);
      list.sort((a, b) => {
        const oa = a.carOrder == null ? Infinity : a.carOrder;
        const ob = b.carOrder == null ? Infinity : b.carOrder;
        if (oa !== ob) return oa - ob;
        return a.sortOrder - b.sortOrder;
      });
      list.forEach((pa, idx) => {
        pa.carOrder = idx + 1;
        ordered.push(pa);
      });
    });
    noCar.forEach((pa) => ordered.push(pa));
    ordered.forEach((pa, idx) => {
      pa.sortOrder = idx;
    });
  }

  function hunterByUUID(u) {
    return state.hunters.find((h) => h.uuid === u);
  }

  // blankIfNone: the reports print an unassigned post as an empty line, not
  // as text, so a gap is obvious at a glance. The editor screens keep the
  // words "Ej tilldelad".
  // ---- "Samma bil hela dagen" (same rules as the app, SameCarAllDay.swift) ----
  // Each hunter gets a car for the day: a hand-set one from
  // state.eventAttendeeDayCars, otherwise the car of their EARLIEST placement
  // in a real car (drive order, then sortOrder). Worked out every time, so
  // fixing drive 1 later fixes it everywhere. A hunter standing in a real car
  // that isn't their day car is shown, never blocked.
  const carKey = (c) => String(c == null ? "" : c).trim();
  const sameCarOn = () => !!(state && state.event && state.event.sameCarAllDay === true);
  // "Åker med hundförare" / "Går till pass" are groups, not cars, unless the
  // user's carRuleExceptions flips that for a name.
  const defaultCountsAsCar = (name) => !/hundförare|till pass/i.test(name);

  function countsAsCar(name) {
    const k = carKey(name);
    if (!k) return false;
    const flipped = (state.event.carRuleExceptions || []).indexOf(k) !== -1;
    return defaultCountsAsCar(k) !== flipped;
  }

  function setCountsAsCar(name, value) {
    const k = carKey(name);
    const list = (state.event.carRuleExceptions || []).filter((x) => x !== k);
    if (value !== defaultCountsAsCar(k)) list.push(k);
    state.event.carRuleExceptions = list;
  }

  function carNamesInUse() {
    const set = new Set();
    state.postAssignments.forEach((pa) => {
      const k = carKey(pa.car);
      if (k) set.add(k);
    });
    return [...set].sort((a, b) => a.localeCompare(b, "sv", { numeric: true }));
  }

  function realCarNames() {
    return carNamesInUse().filter(countsAsCar);
  }

  function derivedDayCar(uuid) {
    const drives = [...state.eventDrives].sort((a, b) => a.driveOrder - b.driveOrder);
    for (const ed of drives) {
      const rows = state.postAssignments
        .filter((pa) => pa.eventDriveLocalId === ed.localId)
        .sort((a, b) => a.sortOrder - b.sortOrder);
      for (const pa of rows) {
        if (pa.assigneeType === "hunter" && pa.hunterUUID === uuid && countsAsCar(pa.car)) return carKey(pa.car);
      }
    }
    return null;
  }

  function dayCarFor(uuid) {
    if (!sameCarOn()) return null;
    const hand = carKey((state.eventAttendeeDayCars || {})[uuid]);
    return hand || derivedDayCar(uuid);
  }

  // The hunter's day car, when this pass is in a different real car; else null.
  function carMismatch(pa) {
    if (!sameCarOn() || pa.assigneeType !== "hunter" || !pa.hunterUUID) return null;
    const car = carKey(pa.car);
    if (!car || !countsAsCar(car)) return null;
    const day = dayCarFor(pa.hunterUUID);
    return day && day !== car ? day : null;
  }

  function assigneeName(pa, blankIfNone) {
    if (pa.assigneeType === "hunter" && pa.hunterUUID) {
      const h = hunterByUUID(pa.hunterUUID);
      return h ? h.name : "Okänd jägare";
    }
    if (pa.assigneeType === "role" && pa.role) return pa.role;
    if (pa.assigneeType === "freeform" && pa.freeformName) {
      // Typed on the spot, not matched to any Hunter uuid — flagged so
      // whoever reviews this later (Fredrik, in the native app) notices
      // it still needs to be reconciled with a real Hunter record.
      return pa.freeformName + " (ny, ej i systemet)";
    }
    return blankIfNone ? "" : "Ej tilldelad";
  }

  // driveOrder is only ever a relative sort key, never a display-ready
  // number — the native app's own driveOrder is 0-indexed (its first
  // drive is 0, not 1), so a real export can and does contain 0. Never
  // show ed.driveOrder directly; the "Såt N" labels always come from a
  // drive's 1-based position in this sorted list instead (see
  // renderDriveCardSetup, renderAssign's driveTabs, renderReport).
  function orderedEventDrives() {
    return [...state.eventDrives].sort((a, b) => a.driveOrder - b.driveOrder);
  }

  function carValueList() {
    const set = new Set();
    state.postAssignments.forEach((pa) => {
      if (pa.car) set.add(pa.car);
    });
    return [...set];
  }

  // ---------- file load / save ----------

  // dropboxInfo: null for a hunt from a file, sample or old #d= link; for a
  // hunt from the drop box, {token, baseVersion, syncedHash, lastMeta}
  // (see the drop box section below). keepTab keeps the current tab when
  // the same hunt is just being refreshed from the drop box.
  function loadPackage(pkg, dropboxInfo, keepTab) {
    if (!pkg || pkg.packageVersion !== 1) {
      alert("Filen känns inte igen som en giltig jaktdags-fil (packageVersion saknas eller stämmer inte).");
      return false;
    }
    const previousTab = ui.tab;
    state = pkg;
    // Older exports (and anything from before this field existed) have no
    // eventAttendees at all — default to "everyone in the roster attends"
    // so nothing that used to show up in the assignee dropdown silently
    // disappears; Fredrik can then narrow it down from the Deltagare box.
    if (!Array.isArray(state.eventAttendees)) {
      state.eventAttendees = state.hunters.map((h) => h.uuid);
    }
    // "Samma bil hela dagen": the three package fields are always present
    // once this editor has seen the hunt, so a switch-off or an "automatic"
    // choice made here reaches the app instead of being read as "not said".
    const hashBeforeDefaults = dropboxInfo && dropboxInfo.syncedHash ? stateHash() : null;
    if (!state.event) state.event = {};
    if (typeof state.event.sameCarAllDay !== "boolean") state.event.sameCarAllDay = false;
    if (!Array.isArray(state.event.carRuleExceptions)) state.event.carRuleExceptions = [];
    if (!state.eventAttendeeDayCars || typeof state.eventAttendeeDayCars !== "object" || Array.isArray(state.eventAttendeeDayCars)) {
      state.eventAttendeeDayCars = {};
    }
    // A draft saved before these defaults existed must not look "changed"
    // just because they were filled in now.
    if (hashBeforeDefaults !== null && dropboxInfo.syncedHash === hashBeforeDefaults) {
      dropboxInfo.syncedHash = stateHash();
    }
    ui = {
      tab: keepTab ? previousTab : "setup",
      selectedEventDriveLocalId: null,
      editingPost: null,
      attendeeBoxOpen: false,
      attendeeFilter: "",
      // Kept across "Hämta senaste" (keepTab); a freshly opened file starts unsorted.
      assignSort: keepTab && ui.assignSort ? ui.assignSort : { key: null, dir: 1 },
    };
    dropbox = dropboxInfo || null;
    if (dropbox && !dropbox.syncedHash) dropbox.syncedHash = stateHash();
    if (!dropbox) dropboxStatusText = "";
    document.getElementById("saveBtn").disabled = false;
    document.getElementById("shareLinkBtn").disabled = false;
    document.getElementById("sendBackBtn").disabled = false;
    render();
    return true;
  }

  // ---------- share link (data embedded in the URL, nothing sent to a server) ----------
  //
  // The whole point is a link someone can open and land on this exact hunt's
  // data with no file to receive or import manually. Everything happens in
  // the browser: the JSON is gzip-compressed (native CompressionStream, no
  // library) and base64url-encoded straight into the URL's #fragment. A
  // fragment is never sent over the network by the browser, so unlike
  // committing the file to the repo, the data only ever exists in the link
  // itself — whoever holds the link holds the data, nobody else.
  // First character of the encoded payload is a format flag ("1" = gzip,
  // "0" = raw) so a receiving browser without CompressionStream support can
  // still be told plainly what it's looking at, and so encoding gracefully
  // degrades to an uncompressed (longer) link instead of failing outright.

  function base64UrlEncode(bytes) {
    let binary = "";
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function base64UrlDecode(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    const binary = atob(str);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function encodeStateForLink(pkg) {
    const bytes = new TextEncoder().encode(JSON.stringify(pkg));
    if (typeof CompressionStream !== "undefined") {
      try {
        const compressedStream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
        const buf = await new Response(compressedStream).arrayBuffer();
        return "1" + base64UrlEncode(new Uint8Array(buf));
      } catch (e) {
        // fall through to the uncompressed form below
      }
    }
    return "0" + base64UrlEncode(bytes);
  }

  async function decodeStateFromLink(encoded) {
    const flag = encoded.slice(0, 1);
    const bytes = base64UrlDecode(encoded.slice(1));
    let jsonBytes = bytes;
    if (flag === "1") {
      if (typeof DecompressionStream === "undefined") {
        throw new Error("den här webbläsaren kan inte packa upp länken (ingen DecompressionStream) — testa en nyare webbläsare");
      }
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      jsonBytes = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    return JSON.parse(new TextDecoder().decode(jsonBytes));
  }

  // The Location photo (locationImageDataURL) is base64 and barely
  // compresses, so it must never go into a #d= link or the address-bar
  // checkpoint (that's what made links too long to send in the first
  // place). It stays in the state, the local autosave slot, saved files and
  // the drop box payload; only link encodings drop it.
  function withoutLocationImage(pkg) {
    if (!pkg || typeof pkg !== "object" || !("locationImageDataURL" in pkg)) return pkg;
    const copy = Object.assign({}, pkg);
    delete copy.locationImageDataURL;
    return copy;
  }

  // Only a plain base64 image data: URL of a known type is ever used as an
  // <img src>; anything else in that field is ignored.
  const LOCATION_IMAGE_RE = /^data:image\/(png|jpeg|gif|webp|heic|heif);base64,[A-Za-z0-9+\/]+={0,2}$/;
  function locationImageSrc(pkg) {
    const v = pkg && pkg.locationImageDataURL;
    return typeof v === "string" && LOCATION_IMAGE_RE.test(v) ? v : null;
  }

  // Apps built with Xcode convert bundled PNGs to Apple's "CgBI" variant
  // (an extra CgBI chunk, premultiplied BGRA pixels, raw deflate). Safari
  // draws those, Chrome and Firefox can't decode them at all, so a photo
  // exported that way would silently vanish from the Rapport. When an <img>
  // fails, this re-encodes such a PNG into a normal one in the browser
  // (8-bit RGBA only, interlaced or not). Best effort: null = couldn't.
  const cgbiCache = new Map();
  function repairAppleCgBiPng(dataUrl) {
    if (!cgbiCache.has(dataUrl)) cgbiCache.set(dataUrl, convertCgBiPng(dataUrl).catch(() => null));
    return cgbiCache.get(dataUrl);
  }

  async function convertCgBiPng(dataUrl) {
    if (typeof DecompressionStream === "undefined") return null;
    const bin = atob(dataUrl.slice(dataUrl.indexOf(",") + 1));
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const dv = new DataView(u.buffer);
    if (u.length < 33 || u[1] !== 0x50 || u[2] !== 0x4e || u[3] !== 0x47) return null;
    let pos = 8, w = 0, h = 0, interlace = 0, rgba8 = false, cgbi = false;
    const idat = [];
    while (pos + 12 <= u.length) {
      const len = dv.getUint32(pos);
      const type = String.fromCharCode(u[pos + 4], u[pos + 5], u[pos + 6], u[pos + 7]);
      if (type === "CgBI") cgbi = true;
      else if (type === "IHDR") {
        w = dv.getUint32(pos + 8); h = dv.getUint32(pos + 12);
        rgba8 = u[pos + 16] === 8 && u[pos + 17] === 6;
        interlace = u[pos + 20];
      } else if (type === "IDAT") idat.push(u.subarray(pos + 8, pos + 8 + len));
      else if (type === "IEND") break;
      pos += 12 + len;
    }
    if (!cgbi || !rgba8 || !w || !h || w > 4096 || h > 4096 || !idat.length) return null;

    const joined = new Uint8Array(idat.reduce((n, c) => n + c.length, 0));
    let o = 0;
    idat.forEach((c) => { joined.set(c, o); o += c.length; });
    const raw = new Uint8Array(await new Response(
      new Blob([joined]).stream().pipeThrough(new DecompressionStream("deflate-raw"))
    ).arrayBuffer());

    const passes = interlace === 1
      ? [[0, 0, 8, 8], [4, 0, 8, 8], [0, 4, 4, 8], [2, 0, 4, 4], [0, 2, 2, 4], [1, 0, 2, 2], [0, 1, 1, 2]]
      : [[0, 0, 1, 1]];
    const out = new Uint8ClampedArray(w * h * 4);
    let off = 0;
    for (const [x0, y0, dx, dy] of passes) {
      const pw = Math.ceil((w - x0) / dx), ph = Math.ceil((h - y0) / dy);
      if (pw <= 0 || ph <= 0) continue;
      const rb = pw * 4;
      if (off + ph * (rb + 1) > raw.length) return null;
      const px = new Uint8Array(ph * rb);
      for (let y = 0; y < ph; y++) {
        const ft = raw[off + y * (rb + 1)], s = off + y * (rb + 1) + 1, r0 = y * rb;
        for (let x = 0; x < rb; x++) {
          const a = x >= 4 ? px[r0 + x - 4] : 0;
          const b = y > 0 ? px[r0 - rb + x] : 0;
          const c = x >= 4 && y > 0 ? px[r0 - rb + x - 4] : 0;
          let v = raw[s + x];
          if (ft === 1) v += a;
          else if (ft === 2) v += b;
          else if (ft === 3) v += (a + b) >> 1;
          else if (ft === 4) {
            const p = a + b - c, pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
            v += pa <= pb && pa <= pc ? a : pb <= pc ? b : c;
          }
          px[r0 + x] = v & 255;
        }
      }
      off += ph * (rb + 1);
      for (let y = 0; y < ph; y++) {
        for (let x = 0; x < pw; x++) {
          const i = y * rb + x * 4, d = ((y0 + y * dy) * w + (x0 + x * dx)) * 4;
          const al = px[i + 3];
          // BGRA premultiplied -> RGBA straight
          out[d] = al ? Math.min(255, Math.round(px[i + 2] * 255 / al)) : 0;
          out[d + 1] = al ? Math.min(255, Math.round(px[i + 1] * 255 / al)) : 0;
          out[d + 2] = al ? Math.min(255, Math.round(px[i] * 255 / al)) : 0;
          out[d + 3] = al;
        }
      }
    }
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").putImageData(new ImageData(out, w, h), 0, 0);
    return canvas.toDataURL("image/png");
  }

  function shareLinkUrl(encoded) {
    return location.origin + location.pathname + "#d=" + encoded;
  }

  // ---------- send back (a remote editor's way to commit their changes) ----------
  //
  // Whoever's editing — usually not Fredrik — needs a way to get their
  // changes back without Fredrik having to open hunt-web himself and click
  // through a "Spara ändringar…" download just to get at the data.
  // "Skicka tillbaka…" downloads the edited package as a JSON file (see
  // suggestedFileName) and opens the editor's own email app, pre-addressed
  // and pre-filled via a mailto: URL, asking them to attach that
  // just-downloaded file before sending — a webpage can't attach a file to
  // an email on its own, so this one manual step (attaching it) is
  // unavoidable without a real mail-sending backend, which this project
  // has deliberately stayed away from. The same share-link encoding "Dela
  // länk…" uses is still included in the email body and shown in the
  // copyable/selected link box, as a fallback for whenever attaching the
  // file is inconvenient (e.g. on a phone) or their mail app never opened.
  const OWNER_EMAIL = "fredrik@bergvik.org";

  // ---------- autosave: resume where you left off, on this same device ----------
  //
  // Whatever hunt is currently on screen is mirrored into localStorage and
  // into the address bar itself (via replaceState, so it never adds
  // back-button history entries) a moment after every edit. That buys two
  // things with no server involved: closing the tab and reopening the page
  // later resumes automatically (checked in init(), below), and a page
  // refresh or an actual bookmark of the address bar also lands back on the
  // same data. This is deliberately a single slot — "whatever you're
  // working on in this browser right now" — matching the one-editor-at-a-
  // time model the rest of this file already assumes (see SCHEMA.md's
  // round-trip notes); opening a different file or a different share link
  // replaces it, the same as it replaces the on-screen state.

  const AUTOSAVE_KEY = "huntPackageAutosave";
  let autosaveTimer = null;
  // "ok" = the browser-local draft matches the screen, "pending" = an edit
  // is waiting for the debounce, "failed" = the browser refused to store it.
  let draftState = "ok";

  function scheduleAutosave() {
    if (!state) return;
    clearTimeout(autosaveTimer);
    draftState = "pending";
    autosaveTimer = setTimeout(() => {
      // Typing in plain fields doesn't re-render, so this debounced hook is
      // also what refreshes the drop box status ("ändringar ej skickade").
      draftState = "saving";
      updateDropboxUi();
      doAutosave().catch(() => {
        // best-effort only — never interrupt editing over a failed autosave
        draftState = "failed";
        updateDropboxUi();
      });
    }, 800);
  }

  // The slot is JSON: {v: 2, encoded, dropbox}. dropbox carries the
  // drop box token and the baseVersion this copy's edits are based on, so
  // resuming later still knows what it was based on (and whether anything
  // is unsent). Older slots were the bare encoded string; readAutosaveSlot
  // still accepts those.
  async function doAutosave() {
    if (!state) return;
    const encoded = await encodeStateForLink(state);
    let stored = false;
    try {
      localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({
        v: 2,
        encoded: encoded,
        dropbox: dropbox
          ? {
              token: dropbox.token,
              baseVersion: dropbox.baseVersion,
              syncedHash: dropbox.syncedHash,
              lastMeta: dropbox.lastMeta || null,
            }
          : null,
      }));
      stored = true;
    } catch (e) {
      // storage full/blocked (e.g. private browsing) — the URL-based
      // checkpoint below still works even if this one doesn't
    }
    // Only claim "ok" if no newer edit arrived while we were encoding.
    if (draftState !== "pending") {
      draftState = stored ? "ok" : "failed";
      updateDropboxUi();
    }
    try {
      // A drop box hunt keeps its short, permanent #h= link in the address
      // bar; the data lives in the drop box and the local slot. Only a
      // hunt without a token (file, sample, old link) still gets the old
      // #d= checkpoint.
      let checkpoint = encoded;
      if (!dropbox && state && "locationImageDataURL" in state) {
        checkpoint = await encodeStateForLink(withoutLocationImage(state));
      }
      history.replaceState(null, "", dropbox ? dropboxLinkUrl(dropbox.token) : shareLinkUrl(checkpoint));
    } catch (e) {
      // ignore — not essential to editing
    }
  }

  function readAutosaveSlot() {
    let raw = null;
    try {
      raw = localStorage.getItem(AUTOSAVE_KEY);
    } catch (e) {
      return null;
    }
    if (!raw) return null;
    if (raw.charAt(0) === "{") {
      try {
        const o = JSON.parse(raw);
        return o && typeof o.encoded === "string" ? o : null;
      } catch (e) {
        return null;
      }
    }
    return { v: 1, encoded: raw, dropbox: null };
  }

  // ---------- three-way merge ----------
  //
  // Reference implementation, verbatim from claude/hunt-web-brief-2026-10-31-merge.md
  // (shared with the app's HuntPackageMerge.swift). Do not change the rules
  // here first: change the brief's reference, then the app, then this copy.
  const HuntMerge = (() => {
// Three-way merge of hunt packages (SCHEMA.md v1) — reference implementation.
// Shared contract between hunt-web (JS) and HuntManagement (Swift port in
// HuntPackageMerge.swift). Both sides MUST produce the same result.
//
// mergePackages(base, local, remote) -> { merged, notes }
//   base   = the package this side last fetched or published (the version
//            its edits started from)
//   local  = this side's current package (with unpublished edits)
//   remote = what the drop box holds now (someone else published since base)
//
// Rule for every single value: if only one side changed it relative to base,
// that change wins; if both changed it to the same thing, fine; if both
// changed it differently, LOCAL wins (the one merging now is the latest) and
// a note is recorded.
//
// Identity (localIds and pa ids are regenerated on every export, so they
// can't be used):
//   eventDrive      -> driveName
//   postAssignment  -> driveName + postNumber + postCode (+ occurrence index
//                      for the rare duplicate)
//   catalog drives  -> name; posts -> postNumber+code; hunters -> uuid
//   attendees       -> hunter uuid

// null and a missing value are the same thing (the app leaves fields out,
// the web may write null).
function deepEqual(a, b) {
  if (a === b) return true;
  if (a == null || b == null) return a == null && b == null;
  if (typeof a !== typeof b) return false;
  if (Array.isArray(a)) {
    if (!Array.isArray(b) || a.length !== b.length) return false;
    return a.every((x, i) => deepEqual(x, b[i]));
  }
  if (typeof a === "object") {
    const ka = Object.keys(a).filter((k) => a[k] != null).sort();
    const kb = Object.keys(b).filter((k) => b[k] != null).sort();
    if (!deepEqual(ka, kb)) return false;
    return ka.every((k) => deepEqual(a[k], b[k]));
  }
  return false;
}

// Returns [value, conflict?]
function pick3(base, local, remote) {
  if (deepEqual(local, base)) return [remote, false];
  if (deepEqual(remote, base)) return [local, false];
  if (deepEqual(local, remote)) return [local, false];
  return [local, true];
}

function setField(obj, key, value) {
  if (value == null) delete obj[key];
  else obj[key] = value;
}

// Swedish names for the notes.
const LABEL = {
  date: "datum", locationName: "plats", huntType: "jakttyp", comment: "kommentar",
  sameCarAllDay: "samma bil hela dagen", carRuleExceptions: "räknas som bil",
  car: "bil", carOrder: "ordning i bil", isHot: "hett", reassemblyPoint: "återsamlingsplats",
};
const PA_LABEL = { ...LABEL, comment: "resultat" };

// The app and the web write the same thing slightly differently. Before
// comparing, bring all three packages to one form so a difference in
// spelling never looks like an edit:
// - empty text = no text (removed)
// - a missing isHot = false; a missing sameCarAllDay = false
// - a missing carRuleExceptions = []; a missing eventAttendeeDayCars = {}
const TEXT_EVENT = ["locationName", "huntType", "comment"];
const TEXT_PA = ["car", "comment"];
function normalize(pkg) {
  const p = JSON.parse(JSON.stringify(pkg || {}));
  p.event = p.event || {};
  for (const f of TEXT_EVENT) if (p.event[f] === "") delete p.event[f];
  if (p.event.sameCarAllDay == null) p.event.sameCarAllDay = false;
  if (p.event.carRuleExceptions == null) p.event.carRuleExceptions = [];
  if (p.eventAttendeeDayCars == null) p.eventAttendeeDayCars = {};
  for (const ed of p.eventDrives || []) if (ed.reassemblyPoint === "") delete ed.reassemblyPoint;
  for (const pa of p.postAssignments || []) {
    for (const f of TEXT_PA) if (pa[f] === "") delete pa[f];
    if (pa.isHot == null) pa.isHot = false;
  }
  return p;
}

      opts.headers = { "Content-Type": "application/json" };
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(DROPBOX_BASE + path, opts);
    let data = null;
    try {
      data = await res.json();
    } catch (e) {
      // non-JSON body — leave data null
    }
    return { status: res.status, data: data };
  }

  // Loads the newest version from the drop box. Returns true when a hunt
  // is on screen afterwards (fetched, or kept because the fetch failed).
  async function fetchLatest(token, opts) {
    opts = opts || {};
    if (opts.confirmIfDirty && isDirty() &&
        !confirm("Du har ändringar som inte är skickade in. Hämta ändå? De ersätts då av den senaste versionen.")) {
      return true;
    }
    dropboxBusy = true;
    mergeInfo = "";
    mergeInfoTitle = "";
    setDropboxStatus("Hämtar från brevlådan…");
    try {
      const r = await dropboxRequest("GET", "/h/" + token);
      if (r.status === 200 && r.data && r.data.payload) {
        const meta = { version: r.data.version, updatedAt: r.data.updatedAt, updatedBy: r.data.updatedBy };
        const ok = loadPackage(r.data.payload, {
          token: token,
          baseVersion: r.data.version,
          syncedHash: null,
          lastMeta: meta,
          remoteMeta: null,
          expiresAt: r.data.expiresAt || null,
        }, opts.keepTab);
        if (!ok) return false;
        setBase(token, meta.version, clonePkg(state));
        scheduleAutosave();
        setDropboxStatus("Hämtad: version " + meta.version + ", senast ändrad av " +
          (meta.updatedBy || "okänd") + " " + formatWhen(meta.updatedAt) + ".", "ok");
        return true;
      }
      if (r.status === 404) {
        setDropboxStatus("Jakten finns inte i brevlådan. Den kan ha tagits bort efter jaktdagen, eller har inte skickats ännu. Be Fredrik skicka den från appen.", "warn");
        return !!state;
      }
      setDropboxStatus("Brevlådan svarade med ett fel (" + r.status + ").", "warn");
      return !!state;
    } catch (e) {
      setDropboxStatus("Kunde inte nå brevlådan. Kontrollera uppkopplingen och försök igen.", "warn");
      return !!state;
    } finally {
      dropboxBusy = false;
      updateDropboxUi();
    }
  }

  // Cheap change check: /meta never downloads the hunt. When someone else
  // has sent in a newer version, take their changes in right away: straight
  // loaded if nothing here is unsent, otherwise merged into the edits.
  async function checkMeta() {
    if (!dropbox || dropboxBusy) return;
    try {
      const r = await dropboxRequest("GET", "/h/" + dropbox.token + "/meta");
      if (r.status === 200 && r.data && dropbox) {
        const newer = r.data.version > dropbox.baseVersion;
        dropbox.remoteMeta = newer ? r.data : null;
        dropbox.expiresAt = r.data.expiresAt || null;
        updateDropboxUi();
        if (newer) await absorbRemote();
      }
    } catch (e) {
      // offline — try again at the next poll
    }
  }

  // Not while someone is typing in a field or has a post open for editing:
  // taking changes in re-draws the page.
  function userIsEditing() {
    const a = document.activeElement;
    if (a && (a.tagName === "TEXTAREA" || a.tagName === "SELECT" ||
        (a.tagName === "INPUT" && a.type !== "checkbox" && a.type !== "radio" && a.type !== "button"))) return true;
    return !!ui.editingPost;
  }

  let absorbRetryTimer = null;

  async function absorbRemote() {
    if (!dropbox || dropboxBusy || !state) return;
    if (userIsEditing()) {
      clearTimeout(absorbRetryTimer);
      absorbRetryTimer = setTimeout(checkMeta, 10000);
      return;
    }
    const token = dropbox.token;
    const baseVer = dropbox.baseVersion;
    dropboxBusy = true;
    updateDropboxUi();
    try {
      const g = await dropboxRequest("GET", "/h/" + token);
      if (g.status !== 200 || !g.data || !g.data.payload || !g.data.version) return;
      if (!dropbox || dropbox.token !== token || dropbox.baseVersion !== baseVer) return;
      const remote = g.data;
      if (remote.version <= baseVer) return;
      const who = remote.updatedBy || "någon annan";
      const info = {
        token: token,
        baseVersion: remote.version,
        syncedHash: null,
        lastMeta: { version: remote.version, updatedAt: remote.updatedAt, updatedBy: remote.updatedBy },
        remoteMeta: null,
        expiresAt: remote.expiresAt || dropbox.expiresAt || null,
      };
      if (!isDirty()) {
        if (!loadPackage(remote.payload, info, true)) return;
        mergeInfo = "";
        mergeInfoTitle = "";
        setBase(token, remote.version, clonePkg(state));
        scheduleAutosave();
        setDropboxStatus("Ändringar från " + who + " har lagts in (version " + remote.version + ").", "ok");
        return;
      }
      const base = await getBase(token, baseVer);
      if (!base) return; // no base for this version: the banner explains
      if (!dropbox || dropbox.token !== token || dropbox.baseVersion !== baseVer) return;
      const res = mergeWithBase(base, clonePkg(state), remote.payload);
      // If the merge leaves exactly the remote hunt, nothing is unsent.
      const canonical = HuntMerge.mergePackages(remote.payload, remote.payload, remote.payload).merged;
      info.syncedHash = HuntMerge.deepEqual(HuntMerge.normalize(res.merged), HuntMerge.normalize(canonical))
        ? null : "remote:" + remote.version;
      if (!adoptPackage(res.merged, info)) return;
      setBase(token, remote.version, clonePkg(remote.payload));
      scheduleAutosave();
      const f = formatNotes(res.notes);
      mergeInfo = "Ändringar från " + who + " har lagts in." + (f.text ? " Obs: " + f.text : "");
      mergeInfoTitle = f.title;
      setDropboxStatus("", "");
    } catch (e) {
      // offline or unexpected — the banner (and the next poll) remain
    } finally {
      dropboxBusy = false;
      updateDropboxUi();
    }
  }

  async function sendToDropbox() {
    if (!isDirty()) {
      setDropboxStatus("Inga ändringar att skicka (version " + dropbox.baseVersion + ").", "ok");
      return;
    }
    const updatedBy = editorName();
    const token = dropbox.token;
    const startHash = stateHash();
    const localSnapshot = clonePkg(state); // exactly what this send starts from
    mergeInfo = "";
    mergeInfoTitle = "";
    dropboxBusy = true;
    setDropboxStatus("Skickar in…");
    const staleMessage = () => setDropboxStatus("Någon annan har ändrat — hämta först. Inget skickades.", "warn");
    try {
      let toSend = localSnapshot;
      let sendBase = dropbox.baseVersion;
      let baseEntry = null;
      let merged = false;
      let who = "";
      let expiresAt = null;
      const notes = [];
      for (let attempt = 0; attempt < 3; attempt++) {
        const r = await dropboxRequest("PUT", "/h/" + token, {
          baseVersion: sendBase,
          updatedBy: updatedBy,
          payload: toSend,
        });
        if (r.status === 200 && r.data) {
          const now = new Date().toISOString();
          const lastMeta = { version: r.data.version, updatedAt: now, updatedBy: updatedBy };
          if (!merged) {
            dropbox.baseVersion = r.data.version;
            dropbox.syncedHash = startHash;
            dropbox.lastMeta = lastMeta;
            dropbox.remoteMeta = null;
            setBase(token, r.data.version, toSend);
            scheduleAutosave();
            setDropboxStatus("Skickat till Fredrik " + formatWhen(now) + " (version " + r.data.version + ").", "ok");
            return;
          }
          // Sent a merged package: the editor now shows it (plus anything
          // typed while the request was in flight, merged on top).
          const info = {
            token: token,
            baseVersion: r.data.version,
            syncedHash: null,
            lastMeta: lastMeta,
            remoteMeta: null,
            expiresAt: expiresAt || dropbox.expiresAt || null,
          };
          let show = clonePkg(toSend);
          if (stateHash() !== startHash) {
            const again = HuntMerge.mergePackages(localSnapshot, clonePkg(state), toSend);
            show = again.merged;
            info.syncedHash = "remote:" + r.data.version;
            for (const n of again.notes) notes.push(n);
          }
          if (!adoptPackage(show, info)) return;
          setBase(token, r.data.version, toSend);
          scheduleAutosave();
          const f = formatNotes(notes);
          const msg = "Sammanslaget med ändringar från " + who + " och skickat (version " + r.data.version + ")." +
            (f.text ? " Obs: " + f.text : "");
          if (info.syncedHash) {
            // Typed while sending: the "ej skickade" line takes the status, so
            // the merge result is shown after it.
            mergeInfo = msg;
            mergeInfoTitle = f.title;
            setDropboxStatus("", "");
          } else {
            setDropboxStatus(msg, f.text ? "warn" : "ok", f.title);
          }
          return;
        }
        if (r.status === 409) {
          dropbox.remoteMeta = r.data && r.data.version ? r.data : null;
          if (!dropbox.remoteMeta) {
            // version 0 = nothing stored any more: the hunt was removed after the hunt day.
            setDropboxStatus("Jakten finns inte längre i brevlådan (den kan ha tagits bort efter jaktdagen). Inget skickades. Spara dina ändringar som fil och be Fredrik skicka jakten från appen igen.", "warn");
            return;
          }
          if (attempt === 2) { staleMessage(); return; }
          // Someone else got there first: merge their version into ours.
          if (!baseEntry) baseEntry = await getBase(token, sendBase);
          if (!baseEntry) { staleMessage(); return; }
          const g = await dropboxRequest("GET", "/h/" + token);
          if (g.status !== 200 || !g.data || !g.data.payload || !g.data.version) { staleMessage(); return; }
          const res = mergeWithBase(baseEntry, toSend, g.data.payload);
          for (const n of res.notes) notes.push(n);
          who = g.data.updatedBy || "någon annan";
          expiresAt = g.data.expiresAt || expiresAt;
          // If it collides again, the next base is what we just merged in.
          baseEntry = { pkg: clonePkg(g.data.payload), noImage: false };
          toSend = res.merged;
          sendBase = g.data.version;
          merged = true;
          setDropboxStatus("Slår ihop med ändringar från " + who + "…");
          continue;
        }
        setDropboxStatus("Brevlådan tog inte emot ändringarna (" + r.status + ").", "warn");
        return;
      }
      staleMessage();
    } catch (e) {
      // Drop box unreachable: fall back to the old file + email route, so
      // the edits still have a way to reach Fredrik.
      await sendBackByEmail("Kunde inte nå brevlådan, så filen har laddats ner och ett mejl öppnats i stället. ");
    } finally {
      dropboxBusy = false;
      updateDropboxUi();
    }
  }

  // Shared by "Spara ändringar…" and "Skicka tillbaka…" — downloads the
  // current state as a JSON file under the given name.
  function downloadJsonPackage(filename) {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function exportPackage() {
    downloadJsonPackage("hunt-" + (state.event.date || "event").replaceAll("-", "") + ".json");
  }

  // A short, filesystem/attachment-safe name for "Skicka tillbaka…"'s
  // downloaded file, built from the hunt's own location + date so it's
  // recognizable in a Downloads folder or an email attachment list without
  // opening it — e.g. "jaktdag-exempelgarden-2026-10-18.json". Diacritics
  // (å/ä/ö) are stripped rather than kept, since attachment names still
  // sometimes get mangled by mail clients that assume ASCII.
  function suggestedFileName(state) {
    const parts = [];
    if (state.event.locationName) parts.push(state.event.locationName);
    if (state.event.date) parts.push(state.event.date);
    if (parts.length === 0) return "jaktdag.json";
    const slug = parts
      .join("-")
      .normalize("NFKD")
      .replace(/[̀-ͯ]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
    return "jaktdag-" + (slug || "odaterad") + ".json";
  }

  let helpOpenFor = null;

  function closeHelp() {

  function openHelp(btn) {
    const h = HELP[btn.dataset.help];
    if (!h) return;
    const pop = document.getElementById("helpPop");
    pop.innerHTML = "";
    const title = document.createElement("h4");
    title.textContent = h.t;
    pop.appendChild(title);
    h.p.forEach((txt) => {
      const p = document.createElement("p");
      p.textContent = txt;
      pop.appendChild(p);
    });
    pop.style.visibility = "hidden";
    pop.style.display = "block";
    const r = btn.getBoundingClientRect();
    const docW = document.documentElement.clientWidth;
    let left = r.left + window.scrollX - 12;
    left = Math.max(8, Math.min(left, window.scrollX + docW - pop.offsetWidth - 8));
    let top = r.bottom + window.scrollY + 6;
    // Not enough room below the button: open above it instead.
    if (r.bottom + pop.offsetHeight + 12 > window.innerHeight && r.top - pop.offsetHeight - 12 > 0) {
      top = r.top + window.scrollY - pop.offsetHeight - 6;
    }
    pop.style.left = left + "px";
    pop.style.top = top + "px";
    pop.style.visibility = "visible";
    btn.setAttribute("aria-expanded", "true");
    helpOpenFor = btn;
  }

  // Inline edit fields for one catalog Post (Nr/Kod/Torn), shown in place
  // of its label when ui.editingPost === post. Post is catalog data
  // shared across every drive/event that uses it (see SCHEMA.md), so a
  // rename here has to update every PostAssignment that referenced the
  // old postNumber+code — not just the row that was clicked — or those
  // other assignments would silently stop matching any post at all.
  function renderPostEditFields(post) {
    const wrap = document.createElement("span");
    wrap.className = "post-edit-inline";
    wrap.innerHTML =
      '<input class="num" data-num style="width:46px">' +
      '<input class="num" data-code style="width:46px">' +
      '<label class="tower-check"><input type="checkbox" data-torn> Torn</label>' +
      '<button class="btn small" data-done>Klart</button>';

    const numInput = wrap.querySelector("[data-num]");
    const codeInput = wrap.querySelector("[data-code]");
    const tornInput = wrap.querySelector("[data-torn]");
    numInput.value = post.postNumber;
    codeInput.value = post.code || "";
    tornInput.checked = post.type === "T";

    function applyRename() {
      const newNum = numInput.value.trim();
      const newCode = codeInput.value.trim();
      const oldNum = post.postNumber;
      const oldCode = post.code || "";
      if (newNum === oldNum && newCode === oldCode) return;
      if (!newNum) {
        alert("Postnummer krävs.");
        numInput.value = oldNum;
        return;
      }
      const conflict = state.posts.find(
        (p) => p !== post && p.postNumber === newNum && (p.code || "") === newCode
      );
      if (conflict) {
        alert("Post " + newNum + newCode + " finns redan.");
        numInput.value = oldNum;
        codeInput.value = oldCode;
        return;
      }
      state.postAssignments.forEach((pa) => {
        if (pa.postNumber === oldNum && (pa.postCode || "") === oldCode) {
          pa.postNumber = newNum;
          pa.postCode = newCode;
        }
      });
      post.postNumber = newNum;
      post.code = newCode;
    }

    numInput.onchange = () => {
      applyRename();
      render();
    };
    codeInput.onchange = () => {
      applyRename();
      render();
    };
    tornInput.onchange = () => {
      post.type = tornInput.checked ? "T" : null;
      render();
    };
    wrap.querySelector("[data-done]").onclick = () => {
      ui.editingPost = null;
      render();
    };

    return wrap;
  }

  function moveDrive(ed, dir) {
    const ordered = orderedEventDrives();
    const idx = ordered.findIndex((x) => x.localId === ed.localId);
    const swapIdx = idx + dir;
    if (swapIdx < 0 || swapIdx >= ordered.length) return;
    const a = ordered[idx], b = ordered[swapIdx];
    const tmp = a.driveOrder;
    a.driveOrder = b.driveOrder;
    b.driveOrder = tmp;
    render();
  }

  // ---- Assign tab (Passfördelning): per-drive Jägare + Resultat ----

  // Cars sorted numeric-aware in Swedish ("Buss 2" before "Buss 10"); a post
  // with no car is always last, whichever way the list is turned.
  function compareAssignByCar(a, b, dir) {
    const ca = (a.car || "").trim();
    const cb = (b.car || "").trim();
    if (ca === "" && cb !== "") return 1;
    if (cb === "" && ca !== "") return -1;
    if (ca !== cb) return dir * ca.localeCompare(cb, "sv", { numeric: true });
    return compareInCar(a, b);
  }

  // The rows of one drive in the order the Passfördelning table shows them.
  // Pass = post number (then code); Bil = car, then Ordning i bil inside the
  // car, the same order the Rapport uses. Display only: sortOrder and every
  // other field are left alone, so sorting never makes the draft "unsent".
  function sortedAssignRows(rows) {
    const { key, dir } = ui.assignSort;
    if (!key) return rows;
    const out = rows.slice();
    if (key === "post") out.sort((a, b) => dir * comparePosts(a, b));
    else if (key === "car") out.sort((a, b) => compareAssignByCar(a, b, dir));
    return out;
  }

  // One click sorts ascending, a second reverses, a third goes back to the
  // file's own order. Switching to the other column starts ascending.
  function clickAssignSort(key) {
    const s = ui.assignSort;
    if (s.key !== key) ui.assignSort = { key: key, dir: 1 };
    else if (s.dir === 1) ui.assignSort = { key: key, dir: -1 };
    else ui.assignSort = { key: null, dir: 1 };
  }

  function sortHeaderHtml(key, label, help) {
    const s = ui.assignSort;
    const active = s.key === key;
    const ind = active ? (s.dir === 1 ? "▲" : "▼") : "";
    const title = active
      ? (s.dir === 1 ? "Sorterat stigande. Klicka för fallande." : "Sorterat fallande. Klicka för ursprunglig ordning.")
      : "Sortera på " + label.toLowerCase();
    return '<th aria-sort="' + (active ? (s.dir === 1 ? "ascending" : "descending") : "none") + '">' +
      '<button type="button" class="sort-btn" data-sort="' + key + '" title="' + escapeAttr(title) + '">' +
      label + '<span class="sort-ind" aria-hidden="true">' + ind + "</span></button>" + (help || "") + "</th>";
  }

    const tbody = table.querySelector("tbody");
    table.querySelectorAll("[data-sort]").forEach((btn) => {
      btn.onclick = () => {

        render();
      };
    });

    sortedAssignRows(assignmentsForDrive(ed.localId)).forEach((pa) => {
      const post = findPost(pa.postNumber, pa.postCode) || { postNumber: pa.postNumber, code: pa.postCode };
      const tr = document.createElement("tr");
      const freeformVisible = pa.assigneeType === "freeform";
      tr.innerHTML =
        '<td class="post-label">' + escapeHtml(displayLabel(post)) + hotMarkHtml(pa) + "</td>" +
        '<td class="readonly">' + escapeHtml(pa.car || "—") + "</td>" +
        '<td>' +
          '<div class="assignee-line"><select data-assignee>' + assigneeOptions(pa) + "</select>" +
          '<span class="car-mismatch" data-mismatch></span></div>' +
          '<input type="text" data-freeform placeholder="Namn på jägaren"' +
            (freeformVisible ? "" : ' style="display:none"') + ">" +
        "</td>" +
        "<td><input type=\"text\" data-comment></td>";
      const mism = carMismatch(pa);
      const mismEl = tr.querySelector("[data-mismatch]");
      if (mism) {
        mismEl.textContent = "(" + mism + ")";
        mismEl.title = "Skyttens bil för dagen är " + mism;
      }
      tr.dataset.paId = pa.id;
      bindPlainField(tr.querySelector("[data-comment]"), pa, "comment");
      bindPlainField(tr.querySelector("[data-freeform]"), pa, "freeformName");
      tr.querySelector("[data-assignee]").onchange = (e) => {
        const v = e.target.value;
        if (v === "") {
          pa.assigneeType = null; pa.hunterUUID = null; pa.role = null; pa.freeformName = null;
        } else if (v === "freeform") {
          pa.assigneeType = "freeform"; pa.hunterUUID = null; pa.role = null;
        } else if (v.startsWith("role:")) {
          pa.assigneeType = "role"; pa.role = v.slice(5); pa.hunterUUID = null; pa.freeformName = null;
        } else if (v.startsWith("hunter:")) {
          pa.assigneeType = "hunter"; pa.hunterUUID = v.slice(7); pa.role = null; pa.freeformName = null;
        }
        // Only the freeform text field's visibility depends on this
        // choice, so a full render() (which would rebuild every row and
        // drop focus) isn't needed — just toggle it in place.
        scheduleAutosave();
        if (sameCarOn()) {
          // Day cars and the "samma bil i dag" groups depend on who stands
          // where, so the whole list is redrawn; keep the typing focus.
          render();
          if (pa.assigneeType === "freeform") {
            const again = document.querySelector('tr[data-pa-id="' + pa.id + '"] [data-freeform]');
            if (again) again.focus();
          }
          return;
        }
        tr.querySelector("[data-freeform]").style.display = pa.assigneeType === "freeform" ? "" : "none";
        if (pa.assigneeType === "freeform") tr.querySelector("[data-freeform]").focus();
      };
      tbody.appendChild(tr);

    wrap.appendChild(table);
    app.innerHTML = "";
    app.appendChild(wrap);
