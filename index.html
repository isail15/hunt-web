<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HuntManagement — Webbredigerare</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%8C%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --border: #d8d8d8;
    --bg: #ffffff;
    --bg-alt: #f6f6f4;
    --text: #1c1c1c;
    --muted: #6b6b6b;
    --accent: #2e5e3e;
    --accent-bg: #eaf2ec;
    --danger: #a6362c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--text);
    background: var(--bg-alt);
  }
  header.top {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
  }
  header.top h1 {
    font-size: 17px;
    margin: 0;
    font-weight: 600;
  }
  header.top .sub {
    color: var(--muted);
    font-size: 13px;
  }
  header.top .spacer { flex: 1; }
  .share-box {
    display: none;
    align-items: center;
    gap: 6px;
    width: 100%;
    order: 10;
    padding-top: 4px;
  }
  .share-box.visible { display: flex; }
  .share-box input {
    flex: 1;
    min-width: 120px;
    font-size: 12px;
  }
  .share-box .status {
    font-size: 12px;
    color: var(--accent);
    white-space: nowrap;
  }
  button, .btn {
    font: inherit;
    font-size: 13px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    cursor: pointer;
    color: var(--text);
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.small { padding: 3px 8px; font-size: 12px; }
  nav.tabs {
    display: flex;
    gap: 4px;
    padding: 10px 20px 0;
    background: var(--bg-alt);
  }
  nav.tabs button {
    border-radius: 8px 8px 0 0;
    border-bottom: none;
    background: var(--bg-alt);
    color: var(--muted);
  }
  nav.tabs button.active {
    background: var(--bg);
    color: var(--text);
    font-weight: 600;
  }
  main {
    padding: 20px;
    max-width: 980px;
    margin: 0 auto;
  }
  .panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 0 8px 8px 8px;
    padding: 18px;
  }
  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
  }
  .field-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px 16px;
    margin-bottom: 18px;
  }
  label.field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
  }
  input, select {
    font: inherit;
    font-size: 13px;
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--bg);
    color: var(--text);
  }
  .drive-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
  }
  .drive-card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg-alt);
    padding: 8px 12px;
    flex-wrap: wrap;
  }
  .drive-card-header .drive-name {
    font-weight: 600;
    font-size: 14px;
    min-width: 140px;
  }
  .drive-card-header .pass-count {
    font-size: 12px;
    color: var(--muted);
    margin-right: -6px;
    white-space: nowrap;
  }
  .car-order-toolbar {
    display: flex;
    justify-content: flex-end;
    padding: 6px 12px 0;
  }
  .drive-card-header .rally {
    flex: 1;
    min-width: 180px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .drive-card-header .rally input { flex: 1; }
  table.assign {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.assign th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
  }
  table.assign td {
    padding: 5px 8px;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
  }
  table.assign input, table.assign select { width: 100%; }
  .post-label {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .post-edit-btn {
    font: inherit;
    font-variant-numeric: tabular-nums;
    background: none;
    border: none;
    padding: 0;
    color: inherit;
    text-decoration: underline dotted;
    text-underline-offset: 2px;
    cursor: pointer;
  }
  .post-edit-btn:disabled {
    text-decoration: none;
    cursor: default;
    opacity: 1;
  }
  .post-edit-inline {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .post-edit-inline input.num { width: 46px; }
  .add-row {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 8px 12px;
    background: var(--bg-alt);
    flex-wrap: wrap;
  }
  .add-row input { width: 90px; }
  .add-row .tower-check { display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--text); }
  .add-row .tower-check input { width: auto; }
  .drive-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .drive-tabs button.active { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .readonly {
    color: var(--muted);
  }
  .attendee-box {
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-alt);
    padding: 10px 12px;
    margin-bottom: 16px;
  }
  .attendee-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
  }
  .attendee-filter {
    width: 100%;
    margin: 8px 0;
  }
  .attendee-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 4px 10px;
    max-height: 220px;
    overflow-y: auto;
    padding-top: 4px;
  }
  .attendee-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    cursor: pointer;
  }
  .attendee-row input { width: auto; }
  table.assign [data-freeform] { margin-top: 4px; }
  #fileInput { display: none; }
  .more-wrap { position: relative; display: inline-block; }
  .more-menu {
    display: none;
    position: fixed;
    z-index: 60;
    min-width: 190px;
    max-width: calc(100vw - 16px);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    padding: 6px;
    flex-direction: column;
    gap: 4px;
  }
  .more-menu.open { display: flex; }
  .more-menu .btn { width: 100%; text-align: left; }
  .dropbox-status {
    display: none;
    width: 100%;
    order: 11;
    font-size: 12px;
    color: var(--muted);
  }
  .dropbox-status.visible { display: block; }
  .dropbox-status.ok { color: var(--accent); }
  .dropbox-status.warn { color: var(--danger); }
  .dropbox-banner {
    display: none;
    margin: 10px 20px 0;
    padding: 10px 14px;
    border: 1px solid #d9b44a;
    background: #fff7e0;
    border-radius: 8px;
    font-size: 13px;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .dropbox-banner.visible { display: flex; }
  .dropbox-banner .msg { flex: 1; min-width: 220px; }
  .hint {
    font-size: 12px;
    color: var(--muted);
    margin: -8px 0 16px;
  }

  /* --- Help (?) popovers --- */
  .help-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    padding: 0;
    margin: 0 0 0 5px;
    border: 1px solid var(--muted);
    border-radius: 50%;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
    text-transform: none;
    letter-spacing: 0;
    vertical-align: middle;
    cursor: pointer;
  }
  .help-btn:hover, .help-btn:focus-visible, .help-btn[aria-expanded="true"] {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-bg);
  }
  #helpPop {
    position: absolute;
    z-index: 1000;
    display: none;
    box-sizing: border-box;
    width: 340px;
    max-width: calc(100vw - 16px);
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
    padding: 10px 12px 8px;
    font-size: 13px;
    line-height: 1.45;
    text-transform: none;
    letter-spacing: 0;
    font-weight: normal;
  }
  #helpPop h4 { margin: 0 0 6px; font-size: 13px; }
  #helpPop p { margin: 0 0 7px; }

  /* --- Report --- */
  #reportRoot {
    background: white;
    color: black;
    padding: 12px;
  }
  /* Location photo (package field locationImageDataURL): top-left of the
     Rapport header with the title centred on the photo's height. Only
     rendered when the package has a photo, so without one the header is
     exactly as before. */
  .report-header {
    position: relative;
    min-height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #reportRoot .report-header h2 {
    margin: 0;
    padding: 0 64px;
    flex: 1 1 auto;
  }
  #reportRoot .report-header { margin-bottom: 14px; }
  .report-header .report-location-img {
    position: absolute;
    left: 0;
    top: 0;
    height: 56px;
    width: 56px;
    object-fit: contain;
  }
  /* No rule under the title any more (the drive headings carry the rules,
     so a title rule would be a fourth line competing with them): the title
     is just larger instead. */
  #reportRoot h2 {
    font-size: 26px;
    margin: 0 0 14px;
    text-align: center;
  }
  .report-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 20px;
  }
  .report-drive {
    margin-bottom: 14px;
    break-inside: avoid;
  }
  /* Three levels, told apart by KIND of emphasis rather than size (matches
     the native sheet): drive = larger + semibold + a rule across the block,
     car = italic only, rows = plain. The rule is a border on the heading
     itself, and the gap to the first car heading is shortened by the same
     3px (2px padding + 1px border), so the sheet is exactly as tall as
     before. A dark solid colour so printers don't drop it. */
  .report-drive h3 {
    font-size: 13px;
    margin: 0;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--accent);
  }
  .report-group h4 {
    font-size: 12px;
    font-style: italic;
    font-weight: 400;
    margin: 6px 0 2px;
  }
  .report-drive h3 + .report-group h4 { margin-top: 3px; }
  .report-row {
    display: flex;
    gap: 6px;
    font-size: 12px;
    padding: 1px 0;
  }
  /* Post column: never wraps. Its width is measured from the longest label
     when the report is built (fitReportPostColumn) so every row still lines
     up; 64px is only the fallback. */
  .report-row .rp { width: var(--rp-w, 64px); flex: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .report-row .rn { flex: 1; }
  .report-row .rc { color: #444; }

  @media print {
    .no-print, .help-btn, #helpPop { display: none !important; }
    body { background: white; }
    main { padding: 0; max-width: none; }
    .panel { border: none; padding: 0; border-radius: 0; }
    @page { size: A4; margin: 12mm; }
  }
</style>
</head>
<body>

<header class="top no-print">
  <h1>HuntManagement</h1>
  <span class="sub" id="eventSummary">Ingen jaktdag inläst</span>
  <span class="spacer"></span>
  <input type="file" id="fileInput" accept="application/json">
  <button class="btn" id="openBtn">Öppna fil…</button>
  <button class="btn" id="shareLinkBtn" disabled>Dela länk…</button>
  <button class="btn" id="sendBackBtn" disabled>Skicka tillbaka…</button>
  <button class="btn" id="fetchLatestBtn" style="display:none" title="Hämtar den nyaste versionen från brevlådan">Hämta senaste</button>
  <button class="btn primary" id="saveBtn" disabled>Spara ändringar…</button>
  <span class="more-wrap" id="moreWrap" style="display:none">
    <button class="btn" id="moreBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="moreMenu">Mer ▾</button>
    <div class="more-menu" id="moreMenu" role="menu"></div>
  </span>
  <button type="button" class="help-btn" data-help="sync" aria-label="Hjälp: spara, skicka och dela" title="Hjälp">?</button>
  <div class="share-box" id="shareBox">
    <input type="text" id="shareLinkInput" readonly>
    <span class="status" id="shareLinkStatus"></span>
    <button class="btn small" id="closeShareLinkBtn">Stäng</button>
  </div>
  <div class="dropbox-status" id="dropboxStatus"></div>
</header>

<div class="dropbox-banner no-print" id="dropboxBanner">
  <span class="msg" id="dropboxBannerMsg"></span>
  <button class="btn small" id="bannerSaveFileBtn">Spara mina ändringar som fil</button>
  <button class="btn small primary" id="bannerFetchBtn">Hämta senaste</button>
</div>

<nav class="tabs no-print" id="tabs">
  <button data-tab="setup" class="active">Förberedelse</button>
  <button data-tab="assign">Passfördelning</button>
  <button data-tab="report">Rapport</button>
</nav>

<main>
  <div class="panel" id="app">
    <div class="empty-state">
      Öppna en exporterad jaktdags-fil (JSON) för att börja, eller ladda
      exempeldata: <button class="btn small" id="loadSampleBtn">öppna exempeldata</button>
    </div>
  </div>
</main>

<div id="helpPop" role="dialog" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  const ROLES = ["Hundförare", "Utställare"];

  /** @type {any} */
  let state = null;
  // editingPost: the exact Post object (a reference into state.posts, from
  // findPost — never a copy) currently shown as inline edit fields in the
  // Förberedelse tab, or null. Compared by identity (===), which stays
  // valid across a rename since editing only mutates the object's fields,
  // never replaces it.
  let ui = {
    tab: "setup",
    selectedEventDriveLocalId: null,
    editingPost: null,
    attendeeBoxOpen: false,
    attendeeFilter: "",
  };

  // ---------- helpers ----------

  function uid(prefix) {
    return prefix + Math.random().toString(36).slice(2, 9);
  }

  function numberLabel(post) {
    return (post.postNumber || "") + (post.code || "");
  }

  function displayLabel(post) {
    let l = numberLabel(post);
    if (post.type) l += " (" + post.type + ")";
    return l;
  }

  // Report notation only (matches the native sheet's Post.reportLabel): a
  // tower post is written the way the hunt leader writes it, T110 / T6HS,
  // instead of "110 (T)". Other types keep the ordinary label. A number that
  // already starts with T (older, un-normalised names) isn't prefixed twice.
  function reportLabel(post) {
    const t = String(post.type || "").trim().toUpperCase();
    if (t === "T") {
      const n = numberLabel(post);
      return /^T/i.test(n) ? n : "T" + n;
    }
    return displayLabel(post);
  }

  function findPost(postNumber, postCode) {
    return state.posts.find(
      (p) => p.postNumber === postNumber && (p.code || "") === (postCode || "")
    );
  }

  function comparePosts(a, b) {
    const pa = findPost(a.postNumber, a.postCode) || { postNumber: a.postNumber, code: a.postCode };
    const pb = findPost(b.postNumber, b.postCode) || { postNumber: b.postNumber, code: b.postCode };
    const na = parseFloat(pa.postNumber);
    const nb = parseFloat(pb.postNumber);
    const va = isNaN(na) ? Infinity : na;
    const vb = isNaN(nb) ? Infinity : nb;
    if (va !== vb) return va - vb;
    const ca = pa.code || "";
    const cb = pb.code || "";
    if (ca !== cb) return ca < cb ? -1 : 1;
    return 0;
  }

  function assignmentsForDrive(localId) {
    return state.postAssignments
      .filter((pa) => pa.eventDriveLocalId === localId)
      .sort((a, b) => a.sortOrder - b.sortOrder);
  }

  // "Sortera om bilordning" (Förberedelse tab) does two things:
  // 1. Renumbers carOrder to a clean 1, 2, 3… per car, using whatever order
  //    is currently there (missing values sort last, ties broken by the
  //    table's own row order) — a cleanup step after manually inserting
  //    someone with a fractional value like 2.1, not a way to choose the
  //    order itself. Assignments with no car set keep their carOrder,
  //    since "Ordning i bil" has no meaning without a car.
  // 2. Re-sorts the table's rows (rewrites sortOrder) to match: car by car
  //    (same car ordering as the Rapport), each car in its Ordning i bil,
  //    and the posts without a car last, in their existing order. Without
  //    this the button looked like it did nothing whenever the numbers were
  //    already clean. Rows only move when this button is pressed, never
  //    while typing, so they don't jump around mid-edit.
  function resortCarOrder(localId) {
    const rows = assignmentsForDrive(localId);
    const byCar = new Map();
    const noCar = [];
    rows.forEach((pa) => {
      const key = (pa.car || "").trim();
      if (!key) { noCar.push(pa); return; }
      if (!byCar.has(key)) byCar.set(key, []);
      byCar.get(key).push(pa);
    });
    const cars = [...byCar.keys()].sort((a, b) => a.localeCompare(b, "sv", { numeric: true }));
    const ordered = [];
    cars.forEach((key) => {
      const list = byCar.get(key);
      list.sort((a, b) => {
        const oa = a.carOrder == null ? Infinity : a.carOrder;
        const ob = b.carOrder == null ? Infinity : b.carOrder;
        if (oa !== ob) return oa - ob;
        return a.sortOrder - b.sortOrder;
      });
      list.forEach((pa, idx) => {
        pa.carOrder = idx + 1;
        ordered.push(pa);
      });
    });
    noCar.forEach((pa) => ordered.push(pa));
    ordered.forEach((pa, idx) => {
      pa.sortOrder = idx;
    });
  }

  function hunterByUUID(u) {
    return state.hunters.find((h) => h.uuid === u);
  }

  function assigneeName(pa) {
    if (pa.assigneeType === "hunter" && pa.hunterUUID) {
      const h = hunterByUUID(pa.hunterUUID);
      return h ? h.name : "Okänd jägare";
    }
    if (pa.assigneeType === "role" && pa.role) return pa.role;
    if (pa.assigneeType === "freeform" && pa.freeformName) {
      // Typed on the spot, not matched to any Hunter uuid — flagged so
      // whoever reviews this later (Fredrik, in the native app) notices
      // it still needs to be reconciled with a real Hunter record.
      return pa.freeformName + " (ny, ej i systemet)";
    }
    return "Ej tilldelad";
  }

  // driveOrder is only ever a relative sort key, never a display-ready
  // number — the native app's own driveOrder is 0-indexed (its first
  // drive is 0, not 1), so a real export can and does contain 0. Never
  // show ed.driveOrder directly; the "Såt N" labels always come from a
  // drive's 1-based position in this sorted list instead (see
  // renderDriveCardSetup, renderAssign's driveTabs, renderReport).
  function orderedEventDrives() {
    return [...state.eventDrives].sort((a, b) => a.driveOrder - b.driveOrder);
  }

  function carValueList() {
    const set = new Set();
    state.postAssignments.forEach((pa) => {
      if (pa.car) set.add(pa.car);
    });
    return [...set];
  }

  // ---------- file load / save ----------

  // dropboxInfo: null for a hunt from a file, sample or old #d= link; for a
  // hunt from the drop box, {token, baseVersion, syncedHash, lastMeta}
  // (see the drop box section below). keepTab keeps the current tab when
  // the same hunt is just being refreshed from the drop box.
  function loadPackage(pkg, dropboxInfo, keepTab) {
    if (!pkg || pkg.packageVersion !== 1) {
      alert("Filen känns inte igen som en giltig jaktdags-fil (packageVersion saknas eller stämmer inte).");
      return false;
    }
    const previousTab = ui.tab;
    state = pkg;
    // Older exports (and anything from before this field existed) have no
    // eventAttendees at all — default to "everyone in the roster attends"
    // so nothing that used to show up in the assignee dropdown silently
    // disappears; Fredrik can then narrow it down from the Deltagare box.
    if (!Array.isArray(state.eventAttendees)) {
      state.eventAttendees = state.hunters.map((h) => h.uuid);
    }
    ui = {
      tab: keepTab ? previousTab : "setup",
      selectedEventDriveLocalId: null,
      editingPost: null,
      attendeeBoxOpen: false,
      attendeeFilter: "",
    };
    dropbox = dropboxInfo || null;
    if (dropbox && !dropbox.syncedHash) dropbox.syncedHash = stateHash();
    if (!dropbox) dropboxStatusText = "";
    document.getElementById("saveBtn").disabled = false;
    document.getElementById("shareLinkBtn").disabled = false;
    document.getElementById("sendBackBtn").disabled = false;
    render();
    return true;
  }

  // ---------- share link (data embedded in the URL, nothing sent to a server) ----------
  //
  // The whole point is a link someone can open and land on this exact hunt's
  // data with no file to receive or import manually. Everything happens in
  // the browser: the JSON is gzip-compressed (native CompressionStream, no
  // library) and base64url-encoded straight into the URL's #fragment. A
  // fragment is never sent over the network by the browser, so unlike
  // committing the file to the repo, the data only ever exists in the link
  // itself — whoever holds the link holds the data, nobody else.
  // First character of the encoded payload is a format flag ("1" = gzip,
  // "0" = raw) so a receiving browser without CompressionStream support can
  // still be told plainly what it's looking at, and so encoding gracefully
  // degrades to an uncompressed (longer) link instead of failing outright.

  function base64UrlEncode(bytes) {
    let binary = "";
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  function base64UrlDecode(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    const binary = atob(str);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  async function encodeStateForLink(pkg) {
    const bytes = new TextEncoder().encode(JSON.stringify(pkg));
    if (typeof CompressionStream !== "undefined") {
      try {
        const compressedStream = new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"));
        const buf = await new Response(compressedStream).arrayBuffer();
        return "1" + base64UrlEncode(new Uint8Array(buf));
      } catch (e) {
        // fall through to the uncompressed form below
      }
    }
    return "0" + base64UrlEncode(bytes);
  }

  async function decodeStateFromLink(encoded) {
    const flag = encoded.slice(0, 1);
    const bytes = base64UrlDecode(encoded.slice(1));
    let jsonBytes = bytes;
    if (flag === "1") {
      if (typeof DecompressionStream === "undefined") {
        throw new Error("den här webbläsaren kan inte packa upp länken (ingen DecompressionStream) — testa en nyare webbläsare");
      }
      const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
      jsonBytes = new Uint8Array(await new Response(stream).arrayBuffer());
    }
    return JSON.parse(new TextDecoder().decode(jsonBytes));
  }

  // The Location photo (locationImageDataURL) is base64 and barely
  // compresses, so it must never go into a #d= link or the address-bar
  // checkpoint (that's what made links too long to send in the first
  // place). It stays in the state, the local autosave slot, saved files and
  // the drop box payload; only link encodings drop it.
  function withoutLocationImage(pkg) {
    if (!pkg || typeof pkg !== "object" || !("locationImageDataURL" in pkg)) return pkg;
    const copy = Object.assign({}, pkg);
    delete copy.locationImageDataURL;
    return copy;
  }

  // Only a plain base64 image data: URL of a known type is ever used as an
  // <img src>; anything else in that field is ignored.
  const LOCATION_IMAGE_RE = /^data:image\/(png|jpeg|gif|webp|heic|heif);base64,[A-Za-z0-9+\/]+={0,2}$/;
  function locationImageSrc(pkg) {
    const v = pkg && pkg.locationImageDataURL;
    return typeof v === "string" && LOCATION_IMAGE_RE.test(v) ? v : null;
  }

  // Apps built with Xcode convert bundled PNGs to Apple's "CgBI" variant
  // (an extra CgBI chunk, premultiplied BGRA pixels, raw deflate). Safari
  // draws those, Chrome and Firefox can't decode them at all, so a photo
  // exported that way would silently vanish from the Rapport. When an <img>
  // fails, this re-encodes such a PNG into a normal one in the browser
  // (8-bit RGBA only, interlaced or not). Best effort: null = couldn't.
  const cgbiCache = new Map();
  function repairAppleCgBiPng(dataUrl) {
    if (!cgbiCache.has(dataUrl)) cgbiCache.set(dataUrl, convertCgBiPng(dataUrl).catch(() => null));
    return cgbiCache.get(dataUrl);
  }

  async function convertCgBiPng(dataUrl) {
    if (typeof DecompressionStream === "undefined") return null;
    const bin = atob(dataUrl.slice(dataUrl.indexOf(",") + 1));
    const u = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    const dv = new DataView(u.buffer);
    if (u.length < 33 || u[1] !== 0x50 || u[2] !== 0x4e || u[3] !== 0x47) return null;
    let pos = 8, w = 0, h = 0, interlace = 0, rgba8 = false, cgbi = false;
    const idat = [];
    while (pos + 12 <= u.length) {
      const len = dv.getUint32(pos);
      const type = String.fromCharCode(u[pos + 4], u[pos + 5], u[pos + 6], u[pos + 7]);
      if (type === "CgBI") cgbi = true;
      else if (type === "IHDR") {
        w = dv.getUint32(pos + 8); h = dv.getUint32(pos + 12);
        rgba8 = u[pos + 16] === 8 && u[pos + 17] === 6;
        interlace = u[pos + 20];
      } else if (type === "IDAT") idat.push(u.subarray(pos + 8, pos + 8 + len));
      else if (type === "IEND") break;
      pos += 12 + len;
    }
    if (!cgbi || !rgba8 || !w || !h || w > 4096 || h > 4096 || !idat.length) return null;

    const joined = new Uint8Array(idat.reduce((n, c) => n + c.length, 0));
    let o = 0;
    idat.forEach((c) => { joined.set(c, o); o += c.length; });
    const raw = new Uint8Array(await new Response(
      new Blob([joined]).stream().pipeThrough(new DecompressionStream("deflate-raw"))
    ).arrayBuffer());

    const passes = interlace === 1
      ? [[0, 0, 8, 8], [4, 0, 8, 8], [0, 4, 4, 8], [2, 0, 4, 4], [0, 2, 2, 4], [1, 0, 2, 2], [0, 1, 1, 2]]
      : [[0, 0, 1, 1]];
    const out = new Uint8ClampedArray(w * h * 4);
    let off = 0;
    for (const [x0, y0, dx, dy] of passes) {
      const pw = Math.ceil((w - x0) / dx), ph = Math.ceil((h - y0) / dy);
      if (pw <= 0 || ph <= 0) continue;
      const rb = pw * 4;
      if (off + ph * (rb + 1) > raw.length) return null;
      const px = new Uint8Array(ph * rb);
      for (let y = 0; y < ph; y++) {
        const ft = raw[off + y * (rb + 1)], s = off + y * (rb + 1) + 1, r0 = y * rb;
        for (let x = 0; x < rb; x++) {
          const a = x >= 4 ? px[r0 + x - 4] : 0;
          const b = y > 0 ? px[r0 - rb + x] : 0;
          const c = x >= 4 && y > 0 ? px[r0 - rb + x - 4] : 0;
          let v = raw[s + x];
          if (ft === 1) v += a;
          else if (ft === 2) v += b;
          else if (ft === 3) v += (a + b) >> 1;
          else if (ft === 4) {
            const p = a + b - c, pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
            v += pa <= pb && pa <= pc ? a : pb <= pc ? b : c;
          }
          px[r0 + x] = v & 255;
        }
      }
      off += ph * (rb + 1);
      for (let y = 0; y < ph; y++) {
        for (let x = 0; x < pw; x++) {
          const i = y * rb + x * 4, d = ((y0 + y * dy) * w + (x0 + x * dx)) * 4;
          const al = px[i + 3];
          // BGRA premultiplied -> RGBA straight
          out[d] = al ? Math.min(255, Math.round(px[i + 2] * 255 / al)) : 0;
          out[d + 1] = al ? Math.min(255, Math.round(px[i + 1] * 255 / al)) : 0;
          out[d + 2] = al ? Math.min(255, Math.round(px[i] * 255 / al)) : 0;
          out[d + 3] = al;
        }
      }
    }
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").putImageData(new ImageData(out, w, h), 0, 0);
    return canvas.toDataURL("image/png");
  }

  function shareLinkUrl(encoded) {
    return location.origin + location.pathname + "#d=" + encoded;
  }

  // ---------- send back (a remote editor's way to commit their changes) ----------
  //
  // Whoever's editing — usually not Fredrik — needs a way to get their
  // changes back without Fredrik having to open hunt-web himself and click
  // through a "Spara ändringar…" download just to get at the data.
  // "Skicka tillbaka…" downloads the edited package as a JSON file (see
  // suggestedFileName) and opens the editor's own email app, pre-addressed
  // and pre-filled via a mailto: URL, asking them to attach that
  // just-downloaded file before sending — a webpage can't attach a file to
  // an email on its own, so this one manual step (attaching it) is
  // unavoidable without a real mail-sending backend, which this project
  // has deliberately stayed away from. The same share-link encoding "Dela
  // länk…" uses is still included in the email body and shown in the
  // copyable/selected link box, as a fallback for whenever attaching the
  // file is inconvenient (e.g. on a phone) or their mail app never opened.
  const OWNER_EMAIL = "fredrik@bergvik.org";

  // ---------- autosave: resume where you left off, on this same device ----------
  //
  // Whatever hunt is currently on screen is mirrored into localStorage and
  // into the address bar itself (via replaceState, so it never adds
  // back-button history entries) a moment after every edit. That buys two
  // things with no server involved: closing the tab and reopening the page
  // later resumes automatically (checked in init(), below), and a page
  // refresh or an actual bookmark of the address bar also lands back on the
  // same data. This is deliberately a single slot — "whatever you're
  // working on in this browser right now" — matching the one-editor-at-a-
  // time model the rest of this file already assumes (see SCHEMA.md's
  // round-trip notes); opening a different file or a different share link
  // replaces it, the same as it replaces the on-screen state.

  const AUTOSAVE_KEY = "huntPackageAutosave";
  let autosaveTimer = null;
  // "ok" = the browser-local draft matches the screen, "pending" = an edit
  // is waiting for the debounce, "failed" = the browser refused to store it.
  let draftState = "ok";

  function scheduleAutosave() {
    if (!state) return;
    clearTimeout(autosaveTimer);
    draftState = "pending";
    autosaveTimer = setTimeout(() => {
      // Typing in plain fields doesn't re-render, so this debounced hook is
      // also what refreshes the drop box status ("ändringar ej skickade").
      draftState = "saving";
      updateDropboxUi();
      doAutosave().catch(() => {
        // best-effort only — never interrupt editing over a failed autosave
        draftState = "failed";
        updateDropboxUi();
      });
    }, 800);
  }

  // The slot is JSON: {v: 2, encoded, dropbox}. dropbox carries the
  // drop box token and the baseVersion this copy's edits are based on, so
  // resuming later still knows what it was based on (and whether anything
  // is unsent). Older slots were the bare encoded string; readAutosaveSlot
  // still accepts those.
  async function doAutosave() {
    if (!state) return;
    const encoded = await encodeStateForLink(state);
    let stored = false;
    try {
      localStorage.setItem(AUTOSAVE_KEY, JSON.stringify({
        v: 2,
        encoded: encoded,
        dropbox: dropbox
          ? {
              token: dropbox.token,
              baseVersion: dropbox.baseVersion,
              syncedHash: dropbox.syncedHash,
              lastMeta: dropbox.lastMeta || null,
            }
          : null,
      }));
      stored = true;
    } catch (e) {
      // storage full/blocked (e.g. private browsing) — the URL-based
      // checkpoint below still works even if this one doesn't
    }
    // Only claim "ok" if no newer edit arrived while we were encoding.
    if (draftState !== "pending") {
      draftState = stored ? "ok" : "failed";
      updateDropboxUi();
    }
    try {
      // A drop box hunt keeps its short, permanent #h= link in the address
      // bar; the data lives in the drop box and the local slot. Only a
      // hunt without a token (file, sample, old link) still gets the old
      // #d= checkpoint.
      let checkpoint = encoded;
      if (!dropbox && state && "locationImageDataURL" in state) {
        checkpoint = await encodeStateForLink(withoutLocationImage(state));
      }
      history.replaceState(null, "", dropbox ? dropboxLinkUrl(dropbox.token) : shareLinkUrl(checkpoint));
    } catch (e) {
      // ignore — not essential to editing
    }
  }

  function readAutosaveSlot() {
    let raw = null;
    try {
      raw = localStorage.getItem(AUTOSAVE_KEY);
    } catch (e) {
      return null;
    }
    if (!raw) return null;
    if (raw.charAt(0) === "{") {
      try {
        const o = JSON.parse(raw);
        return o && typeof o.encoded === "string" ? o : null;
      } catch (e) {
        return null;
      }
    }
    return { v: 1, encoded: raw, dropbox: null };
  }

  // ---------- drop box (short #h= links, send in / fetch latest) ----------
  //
  // The contract is SCHEMA.md's "Drop box API" section. The Worker stores
  // this hunt's package under a token with a version counter; a push says
  // which version it was based on and is refused (409) if someone else got
  // there first. The web never invents a token: it only uses the one its
  // #h= link gave it, and Fredrik's app originates every hunt.

  const DROPBOX_BASE = "https://hunt-dropbox.itunes-usa.workers.dev";
  const TOKEN_RE = /^[A-Za-z0-9_-]{22}$/;
  const EDITOR_NAME_KEY = "huntEditorName";
  const DEFAULT_EDITOR_NAME = "Webbredigering";
  const META_POLL_MS = 3 * 60 * 1000;

  // null, or {token, baseVersion, syncedHash, lastMeta, remoteMeta}
  let dropbox = null;
  let dropboxBusy = false;

  function dropboxLinkUrl(token) {
    return location.origin + location.pathname + "#h=" + token;
  }

  // FNV-1a over the JSON text: cheap, and enough to tell "same as what
  // was last fetched or sent" from "edited since".
  function stateHash() {
    const str = JSON.stringify(state);
    let h = 0x811c9dc5;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 0x01000193);
    }
    return (h >>> 0).toString(16) + ":" + str.length;
  }

  function isDirty() {
    return !!(dropbox && state && stateHash() !== dropbox.syncedHash);
  }

  function formatWhen(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const pad = (n) => String(n).padStart(2, "0");
    const time = pad(d.getHours()) + ":" + pad(d.getMinutes());
    const now = new Date();
    const sameDay = d.getFullYear() === now.getFullYear() &&
      d.getMonth() === now.getMonth() && d.getDate() === now.getDate();
    return sameDay ? time : d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + " " + time;
  }

  function editorName() {
    let name = null;
    try {
      name = localStorage.getItem(EDITOR_NAME_KEY);
    } catch (e) {
      // storage blocked — ask again next time, fall back below
    }
    if (name === null) {
      const typed = prompt("Vad heter du? Namnet visas för Fredrik när du skickar in ändringar.", "");
      name = typed && typed.trim() ? typed.trim() : DEFAULT_EDITOR_NAME;
      try {
        localStorage.setItem(EDITOR_NAME_KEY, name);
      } catch (e) {
        // ignore
      }
    }
    return name === DEFAULT_EDITOR_NAME ? name : name + " (web)";
  }

  let dropboxStatusText = "";
  let dropboxStatusKind = "";

  function setDropboxStatus(text, kind) {
    dropboxStatusText = text;
    dropboxStatusKind = kind || "";
    updateDropboxUi();
  }

  // In drop box (link) mode the header is reduced to what a helper needs:
  // Skicka in (primary), Hämta senaste, and a "Mer ▾" menu holding the file
  // and link actions. Otherwise (no hunt, file, sample, old #d= link) the
  // original row of buttons is shown. The same button elements are moved
  // back and forth, so their handlers survive; the function is idempotent.
  function layoutHeaderButtons(linkMode) {
    const openB = document.getElementById("openBtn");
    const shareB = document.getElementById("shareLinkBtn");
    const sendB = document.getElementById("sendBackBtn");
    const fetchB = document.getElementById("fetchLatestBtn");
    const saveB = document.getElementById("saveBtn");
    const wrap = document.getElementById("moreWrap");
    const menu = document.getElementById("moreMenu");
    const inMenu = menu.contains(saveB);
    if (linkMode === inMenu) {
      sendB.classList.toggle("primary", linkMode);
      return;
    }
    closeMoreMenu();
    if (linkMode) {
      saveB.textContent = "Spara som fil…";
      saveB.classList.remove("primary");
      sendB.classList.add("primary");
      menu.appendChild(shareB);
      menu.appendChild(saveB);
      menu.appendChild(openB);
      wrap.style.display = "";
    } else {
      wrap.style.display = "none";
      saveB.textContent = "Spara ändringar…";
      saveB.classList.add("primary");
      sendB.classList.remove("primary");
      sendB.parentNode.insertBefore(openB, sendB);
      sendB.parentNode.insertBefore(shareB, sendB);
      wrap.parentNode.insertBefore(saveB, wrap);
    }
  }

  function closeMoreMenu() {
    const menu = document.getElementById("moreMenu");
    const btn = document.getElementById("moreBtn");
    if (!menu) return;
    menu.classList.remove("open");
    btn.setAttribute("aria-expanded", "false");
  }

  function openMoreMenu() {
    const menu = document.getElementById("moreMenu");
    const btn = document.getElementById("moreBtn");
    menu.classList.add("open");
    btn.setAttribute("aria-expanded", "true");
    const r = btn.getBoundingClientRect();
    const vw = document.documentElement.clientWidth;
    let left = r.right - menu.offsetWidth;
    left = Math.max(8, Math.min(left, vw - menu.offsetWidth - 8));
    menu.style.left = left + "px";
    menu.style.top = (r.bottom + 6) + "px";
  }

  document.getElementById("moreBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    if (document.getElementById("moreMenu").classList.contains("open")) closeMoreMenu();
    else openMoreMenu();
  });
  document.addEventListener("click", (e) => {
    if (!e.target.closest || !e.target.closest("#moreWrap")) closeMoreMenu();
    else if (e.target.closest("#moreMenu button")) closeMoreMenu();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.getElementById("moreMenu").classList.contains("open")) {
      closeMoreMenu();
      document.getElementById("moreBtn").focus();
    }
  });
  window.addEventListener("resize", closeMoreMenu);
  window.addEventListener("scroll", closeMoreMenu, { passive: true });

  function updateDropboxUi() {
    const sendBtn = document.getElementById("sendBackBtn");
    const fetchBtn = document.getElementById("fetchLatestBtn");
    const statusEl = document.getElementById("dropboxStatus");
    const banner = document.getElementById("dropboxBanner");
    layoutHeaderButtons(!!dropbox);
    sendBtn.textContent = dropbox ? "Skicka in" : "Skicka tillbaka…";
    fetchBtn.style.display = dropbox ? "" : "none";
    sendBtn.disabled = !state || dropboxBusy;
    fetchBtn.disabled = dropboxBusy;

    let text = dropboxStatusText;
    let kind = dropboxStatusKind;
    if (dropbox && state && isDirty() && kind !== "warn") {
      text = "Ändringar ej skickade (baserat på version " + dropbox.baseVersion + ").";
      kind = "";
      if (draftState === "failed") {
        text += " Det går inte att spara utkast i den här webbläsaren — skicka in eller spara som fil.";
        kind = "warn";
      } else if (draftState === "ok") {
        text += " Utkastet är sparat i den här webbläsaren.";
      }
    }
    statusEl.textContent = text;
    statusEl.className = "dropbox-status" + (text ? " visible" : "") + (kind ? " " + kind : "");

    const remote = dropbox && dropbox.remoteMeta;
    if (remote && remote.version > dropbox.baseVersion) {
      const who = (remote.updatedBy || "Någon") + " ändrade " + formatWhen(remote.updatedAt) +
        " (version " + remote.version + ")";
      const dirty = isDirty();
      document.getElementById("dropboxBannerMsg").textContent = dirty
        ? who + " medan du redigerade. Dina ändringar är inte skickade, och de går inte att skicka in " +
          "förrän du har hämtat den nya versionen. Vill du behålla dem: spara dem som fil först."
        : who + ". Hämta den för att se ändringarna.";
      document.getElementById("bannerSaveFileBtn").style.display = dirty ? "" : "none";
      document.getElementById("bannerFetchBtn").disabled = dropboxBusy;
      banner.classList.add("visible");
    } else {
      banner.classList.remove("visible");
    }
  }

  async function dropboxRequest(method, path, body) {
    const opts = { method: method, cache: "no-store" };
    if (body !== undefined) {
      opts.headers = { "Content-Type": "application/json" };
      opts.body = JSON.stringify(body);
    }
    const res = await fetch(DROPBOX_BASE + path, opts);
    let data = null;
    try {
      data = await res.json();
    } catch (e) {
      // non-JSON body — leave data null
    }
    return { status: res.status, data: data };
  }

  // Loads the newest version from the drop box. Returns true when a hunt
  // is on screen afterwards (fetched, or kept because the fetch failed).
  async function fetchLatest(token, opts) {
    opts = opts || {};
    if (opts.confirmIfDirty && isDirty() &&
        !confirm("Du har ändringar som inte är skickade in. Hämta ändå? De ersätts då av den senaste versionen.")) {
      return true;
    }
    dropboxBusy = true;
    setDropboxStatus("Hämtar från brevlådan…");
    try {
      const r = await dropboxRequest("GET", "/h/" + token);
      if (r.status === 200 && r.data && r.data.payload) {
        const meta = { version: r.data.version, updatedAt: r.data.updatedAt, updatedBy: r.data.updatedBy };
        const ok = loadPackage(r.data.payload, {
          token: token,
          baseVersion: r.data.version,
          syncedHash: null,
          lastMeta: meta,
          remoteMeta: null,
        }, opts.keepTab);
        if (!ok) return false;
        setDropboxStatus("Hämtad: version " + meta.version + ", senast ändrad av " +
          (meta.updatedBy || "okänd") + " " + formatWhen(meta.updatedAt) + ".", "ok");
        return true;
      }
      if (r.status === 404) {
        setDropboxStatus("Den här länken har ingen jakt i brevlådan ännu. Be Fredrik skicka den från appen.", "warn");
        return !!state;
      }
      setDropboxStatus("Brevlådan svarade med ett fel (" + r.status + ").", "warn");
      return !!state;
    } catch (e) {
      setDropboxStatus("Kunde inte nå brevlådan. Kontrollera uppkopplingen och försök igen.", "warn");
      return !!state;
    } finally {
      dropboxBusy = false;
      updateDropboxUi();
    }
  }

  // Cheap change check: /meta never downloads the hunt.
  async function checkMeta() {
    if (!dropbox || dropboxBusy) return;
    try {
      const r = await dropboxRequest("GET", "/h/" + dropbox.token + "/meta");
      if (r.status === 200 && r.data && dropbox) {
        dropbox.remoteMeta = r.data.version > dropbox.baseVersion ? r.data : null;
        updateDropboxUi();
      }
    } catch (e) {
      // offline — try again at the next poll
    }
  }

  async function sendToDropbox() {
    if (!isDirty()) {
      setDropboxStatus("Inga ändringar att skicka (version " + dropbox.baseVersion + ").", "ok");
      return;
    }
    const updatedBy = editorName();
    const sentHash = stateHash();
    dropboxBusy = true;
    setDropboxStatus("Skickar in…");
    try {
      const r = await dropboxRequest("PUT", "/h/" + dropbox.token, {
        baseVersion: dropbox.baseVersion,
        updatedBy: updatedBy,
        payload: state,
      });
      if (r.status === 200 && r.data) {
        const now = new Date().toISOString();
        dropbox.baseVersion = r.data.version;
        dropbox.syncedHash = sentHash;
        dropbox.lastMeta = { version: r.data.version, updatedAt: now, updatedBy: updatedBy };
        dropbox.remoteMeta = null;
        scheduleAutosave();
        setDropboxStatus("Skickat till Fredrik " + formatWhen(now) + " (version " + r.data.version + ").", "ok");
        return;
      }
      if (r.status === 409) {
        dropbox.remoteMeta = r.data && r.data.version ? r.data : null;
        setDropboxStatus("Någon annan har ändrat — hämta först. Inget skickades.", "warn");
        return;
      }
      setDropboxStatus("Brevlådan tog inte emot ändringarna (" + r.status + ").", "warn");
    } catch (e) {
      // Drop box unreachable: fall back to the old file + email route, so
      // the edits still have a way to reach Fredrik.
      await sendBackByEmail("Kunde inte nå brevlådan, så filen har laddats ner och ett mejl öppnats i stället. ");
    } finally {
      dropboxBusy = false;
      updateDropboxUi();
    }
  }

  function handleFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        loadPackage(JSON.parse(reader.result));
      } catch (e) {
        alert("Kunde inte läsa filen: " + e.message);
      }
    };
    reader.readAsText(file);
  }

  // Shared by "Spara ändringar…" and "Skicka tillbaka…" — downloads the
  // current state as a JSON file under the given name.
  function downloadJsonPackage(filename) {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function exportPackage() {
    downloadJsonPackage("hunt-" + (state.event.date || "event").replaceAll("-", "") + ".json");
  }

  // A short, filesystem/attachment-safe name for "Skicka tillbaka…"'s
  // downloaded file, built from the hunt's own location + date so it's
  // recognizable in a Downloads folder or an email attachment list without
  // opening it — e.g. "jaktdag-exempelgarden-2026-10-18.json". Diacritics
  // (å/ä/ö) are stripped rather than kept, since attachment names still
  // sometimes get mangled by mail clients that assume ASCII.
  function suggestedFileName(state) {
    const parts = [];
    if (state.event.locationName) parts.push(state.event.locationName);
    if (state.event.date) parts.push(state.event.date);
    if (parts.length === 0) return "jaktdag.json";
    const slug = parts
      .join("-")
      .normalize("NFKD")
      .replace(/[̀-ͯ]/g, "")
      .toLowerCase()
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
    return "jaktdag-" + (slug || "odaterad") + ".json";
  }

  function bindPlainField(el, obj, key, parse) {
    el.value = obj[key] == null ? "" : obj[key];

      obj[key] = parse ? parse(v) : v;

      // in a car/comment/date field shouldn't re-render the whole tab on
      // every keystroke), so it has to schedule the autosave itself —
      // render() alone would miss every edit made through this function.
      scheduleAutosave();

  function helpBtn(key) {
    return '<button type="button" class="help-btn no-print" data-help="' + key +
      '" aria-label="Hjälp: ' + escapeAttr(HELP[key].t) + '" title="Hjälp">?</button>';

  let helpOpenFor = null;

  function closeHelp() {
    const pop = document.getElementById("helpPop");
    if (pop) pop.style.display = "none";
    if (helpOpenFor) helpOpenFor.setAttribute("aria-expanded", "false");
    helpOpenFor = null;
  }

  function openHelp(btn) {
    const h = HELP[btn.dataset.help];
    if (!h) return;
    const pop = document.getElementById("helpPop");
    pop.innerHTML = "";
    const title = document.createElement("h4");
    title.textContent = h.t;
    pop.appendChild(title);
    h.p.forEach((txt) => {
      const p = document.createElement("p");
      p.textContent = txt;
      pop.appendChild(p);
    });
    pop.style.visibility = "hidden";
    pop.style.display = "block";
    const r = btn.getBoundingClientRect();
    const docW = document.documentElement.clientWidth;
    let left = r.left + window.scrollX - 12;
    left = Math.max(8, Math.min(left, window.scrollX + docW - pop.offsetWidth - 8));
    let top = r.bottom + window.scrollY + 6;
    // Not enough room below the button: open above it instead.
    if (r.bottom + pop.offsetHeight + 12 > window.innerHeight && r.top - pop.offsetHeight - 12 > 0) {
      top = r.top + window.scrollY - pop.offsetHeight - 6;
    }
    pop.style.left = left + "px";
    pop.style.top = top + "px";
    pop.style.visibility = "visible";
    btn.setAttribute("aria-expanded", "true");
    helpOpenFor = btn;
  }

  document.addEventListener("click", (e) => {
    const btn = e.target.closest && e.target.closest(".help-btn");
    if (btn) {
      e.preventDefault();
      const same = helpOpenFor === btn;
      closeHelp();
      if (!same) openHelp(btn);
      return;
    }
    if (helpOpenFor && !e.target.closest("#helpPop")) closeHelp();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && helpOpenFor) {
      const b = helpOpenFor;
      closeHelp();
      b.focus();
    }
  });

  // Inline edit fields for one catalog Post (Nr/Kod/Torn), shown in place
  // of its label when ui.editingPost === post. Post is catalog data
  // shared across every drive/event that uses it (see SCHEMA.md), so a
  // rename here has to update every PostAssignment that referenced the
  // old postNumber+code — not just the row that was clicked — or those
  // other assignments would silently stop matching any post at all.
  function renderPostEditFields(post) {
    const wrap = document.createElement("span");
    wrap.className = "post-edit-inline";
    wrap.innerHTML =
      '<input class="num" data-num style="width:46px">' +
      '<input class="num" data-code style="width:46px">' +
      '<label class="tower-check"><input type="checkbox" data-torn> Torn</label>' +
      '<button class="btn small" data-done>Klart</button>';

    const numInput = wrap.querySelector("[data-num]");
    const codeInput = wrap.querySelector("[data-code]");
    const tornInput = wrap.querySelector("[data-torn]");
    numInput.value = post.postNumber;
    codeInput.value = post.code || "";
    tornInput.checked = post.type === "T";

    function applyRename() {
      const newNum = numInput.value.trim();
      const newCode = codeInput.value.trim();
      const oldNum = post.postNumber;
      const oldCode = post.code || "";
      if (newNum === oldNum && newCode === oldCode) return;
      if (!newNum) {
        alert("Postnummer krävs.");
        numInput.value = oldNum;
        return;
      }
      const conflict = state.posts.find(
        (p) => p !== post && p.postNumber === newNum && (p.code || "") === newCode
      );
      if (conflict) {
        alert("Post " + newNum + newCode + " finns redan.");
        numInput.value = oldNum;
        codeInput.value = oldCode;
        return;
      }
      state.postAssignments.forEach((pa) => {
        if (pa.postNumber === oldNum && (pa.postCode || "") === oldCode) {
          pa.postNumber = newNum;
          pa.postCode = newCode;
        }
      });
      post.postNumber = newNum;
      post.code = newCode;
    }

    numInput.onchange = () => {
      applyRename();
      render();
    };
    codeInput.onchange = () => {
      applyRename();
      render();
    };
    tornInput.onchange = () => {
      post.type = tornInput.checked ? "T" : null;
      render();
    };
    wrap.querySelector("[data-done]").onclick = () => {
      ui.editingPost = null;
      render();
    };

    return wrap;
  }

  function renderDriveCardSetup(ed, driveNumber, isFirst, isLast) {
    const card = document.createElement("div");
    card.className = "drive-card";

    const header = document.createElement("div");
    header.className = "drive-card-header";
    // Pass count: how many PostAssignments ("pass" — see the Passfördelning
    // tab's own naming) this drive has, not how many catalog Posts exist —
    // shown here so it's visible while building out the drive, before any
    // hunter is assigned to a single one of them.
    const passCount = assignmentsForDrive(ed.localId).length;
    header.innerHTML =
      '<button class="btn small" data-up' + (isFirst ? " disabled" : "") + ">↑</button>" +
      '<button class="btn small" data-down' + (isLast ? " disabled" : "") + ">↓</button>" +
      '<span class="drive-name">Såt ' + driveNumber + ": " + escapeHtml(ed.driveName) + "</span>" +
      '<span class="pass-count">' + passCount + " pass,</span>" +
      '<span class="rally">Återsamlingsplats:' + helpBtn("rally") + ' <input type="text" data-rally></span>' +
      '<button class="btn small danger" data-del-drive>Ta bort drev</button>';
    card.appendChild(header);

    const rallyInput = header.querySelector("[data-rally]");
    bindPlainField(rallyInput, ed, "reassemblyPoint");

    header.querySelector("[data-up]").onclick = () => moveDrive(ed, -1);
    header.querySelector("[data-down]").onclick = () => moveDrive(ed, 1);
    header.querySelector("[data-del-drive]").onclick = () => {
      if (!confirm('Ta bort "' + ed.driveName + '" och alla dess poster från den här jaktdagen?')) return;
      state.eventDrives = state.eventDrives.filter((x) => x.localId !== ed.localId);
      state.postAssignments = state.postAssignments.filter((pa) => pa.eventDriveLocalId !== ed.localId);
      render();
    };

    const orderToolbar = document.createElement("div");
    orderToolbar.className = "car-order-toolbar";
    orderToolbar.innerHTML =
      '<button class="btn small" data-resort-order>Sortera om bilordning</button>' + helpBtn("resort");
    orderToolbar.querySelector("[data-resort-order]").onclick = () => {
      resortCarOrder(ed.localId);
      render();
    };
    card.appendChild(orderToolbar);

    const table = document.createElement("table");
    table.className = "assign";
    table.innerHTML =
      "<thead><tr><th>Pass</th><th>Bil" + helpBtn("car") + "</th><th>Ordning i bil" + helpBtn("carOrder") +
      "</th><th></th></tr></thead><tbody></tbody>";
    const tbody = table.querySelector("tbody");

    assignmentsForDrive(ed.localId).forEach((pa) => {
      const tr = document.createElement("tr");
      // post is the real catalog object (a reference into state.posts) so
      // it can be edited in place; the fallback (no match found — should
      // not happen in practice) is a throwaway shape, not editable.
      const post = findPost(pa.postNumber, pa.postCode);
      const fallbackPost = post || { postNumber: pa.postNumber, code: pa.postCode };
      tr.innerHTML =
        '<td class="post-label" data-post-cell></td>' +
        '<td><input list="carValues" data-car></td>' +
        // Plain text, not type="number" — a number input's spin arrows nudge
        // by a fixed step (0.1 here), which is fiddly for entering a specific
        // car-boarding position. Select-all-on-focus means clicking or
        // tabbing in lets you just type over the old value; typing a messy
        // decimal (e.g. to insert between 1 and 2) is fine since "Sortera om
        // bilordning" (resortCarOrder, above) cleans these up afterward.
        '<td><input type="text" inputmode="decimal" data-order style="width:70px" onfocus="this.select()"></td>' +
        '<td><button class="btn small danger" data-del>Ta bort</button></td>';

      const postCell = tr.querySelector("[data-post-cell]");
      if (post && ui.editingPost === post) {
        postCell.appendChild(renderPostEditFields(post));
      } else {

      bindPlainField(tr.querySelector("[data-car]"), pa, "car");
      bindPlainField(tr.querySelector("[data-order]"), pa, "carOrder", (v) => (v === null ? null : parseFloat(v.replace(",", "."))));
      tr.querySelector("[data-del]").onclick = () => {
        state.postAssignments = state.postAssignments.filter((x) => x !== pa);
        render();
      };
      tbody.appendChild(tr);
    });

    card.appendChild(table);

    const addRow = document.createElement("div");
    addRow.className = "add-row";
    addRow.innerHTML =
      '<input class="num" data-num placeholder="Nr">' +
      '<input class="num" data-code placeholder="Kod">' +
      '<label class="tower-check"><input type="checkbox" data-torn> Torn</label>' +
      '<button class="btn small" data-add-post>+ Lägg till post</button>' + helpBtn("addPost") +
      '<datalist id="carValues">' +
      carValueList().map((c) => '<option value="' + escapeAttr(c) + '">').join("") +
      "</datalist>";

    addRow.querySelector("[data-add-post]").onclick = () => {

      const isTower = addRow.querySelector("[data-torn]").checked;
      if (!num) return;
      if (!findPost(num, code)) {
        state.posts.push({ postNumber: num, code: code || "", type: isTower ? "T" : null, description: null, isRetired: false });
      }
      const existing = assignmentsForDrive(ed.localId);
      if (existing.find((pa) => pa.postNumber === num && (pa.postCode || "") === code)) {
        alert("Den posten finns redan på det här drevet.");
        return;
      }
      const maxSort = existing.reduce((m, pa) => Math.max(m, pa.sortOrder), -1);
      state.postAssignments.push({
        id: uid("pa"),
        eventDriveLocalId: ed.localId,
        postNumber: num,
        postCode: code,
        assigneeType: null,
        hunterUUID: null,
        role: null,
        car: null,
        carOrder: null,
        comment: null,
        sortOrder: maxSort + 1,
      });
      render();
    };

    return card;
  }

  function moveDrive(ed, dir) {
    const ordered = orderedEventDrives();
    const idx = ordered.findIndex((x) => x.localId === ed.localId);
    const swapIdx = idx + dir;
    if (swapIdx < 0 || swapIdx >= ordered.length) return;
    const a = ordered[idx], b = ordered[swapIdx];
    const tmp = a.driveOrder;
    a.driveOrder = b.driveOrder;
    b.driveOrder = tmp;
    render();
  }

      const freeformVisible = pa.assigneeType === "freeform";
      tr.innerHTML =
        '<td class="post-label">' + escapeHtml(displayLabel(post)) + "</td>" +
        '<td class="readonly">' + escapeHtml(pa.car || "—") + "</td>" +
        '<td>' +
          '<select data-assignee>' + assigneeOptions(pa) + "</select>" +
          '<input type="text" data-freeform placeholder="Namn på jägaren"' +
            (freeformVisible ? "" : ' style="display:none"') + ">" +
        "</td>" +
        "<td><input type=\"text\" data-comment></td>";
      bindPlainField(tr.querySelector("[data-comment]"), pa, "comment");
      bindPlainField(tr.querySelector("[data-freeform]"), pa, "freeformName");
      tr.querySelector("[data-assignee]").onchange = (e) => {
        const v = e.target.value;
        if (v === "") {
          pa.assigneeType = null; pa.hunterUUID = null; pa.role = null; pa.freeformName = null;
        } else if (v === "freeform") {
          pa.assigneeType = "freeform"; pa.hunterUUID = null; pa.role = null;
        } else if (v.startsWith("role:")) {
          pa.assigneeType = "role"; pa.role = v.slice(5); pa.hunterUUID = null; pa.freeformName = null;
        } else if (v.startsWith("hunter:")) {
          pa.assigneeType = "hunter"; pa.hunterUUID = v.slice(7); pa.role = null; pa.freeformName = null;
        }
        // Only the freeform text field's visibility depends on this
        // choice, so a full render() (which would rebuild every row and
        // drop focus) isn't needed — just toggle it in place.
        tr.querySelector("[data-freeform]").style.display = pa.assigneeType === "freeform" ? "" : "none";
        if (pa.assigneeType === "freeform") tr.querySelector("[data-freeform]").focus();
        scheduleAutosave();
      };
      tbody.appendChild(tr);
    });

    wrap.appendChild(table);
    app.innerHTML = "";
    app.appendChild(wrap);
  }

  function assigneeOptions(pa) {
    let html = '<option value=""' + (pa.assigneeType == null ? " selected" : "") + ">Ej tilldelad</option>";
    html += '<optgroup label="Funktionsroll">';
    ROLES.forEach((r) => {
      const sel = pa.assigneeType === "role" && pa.role === r;
      html += '<option value="role:' + r + '"' + (sel ? " selected" : "") + ">" + r + "</option>";
    });
    html += "</optgroup>";
    html += '<optgroup label="Jägare">';
    // Only today's attendees (see the Deltagare box) show up here — not
    // the whole Hunter catalog — so this list stays short and relevant.
    // A hunter already assigned here is always kept, even if they've
    // since been unchecked as an attendee, so an existing assignment
    // never silently loses its label.
    const attendeeSet = new Set(state.eventAttendees || []);
    [...state.hunters]
      .filter((h) => attendeeSet.has(h.uuid) || (pa.assigneeType === "hunter" && pa.hunterUUID === h.uuid))
      .sort((a, b) => a.name.localeCompare(b.name, "sv"))
      .forEach((h) => {
        const sel = pa.assigneeType === "hunter" && pa.hunterUUID === h.uuid;
        const notAttending = !attendeeSet.has(h.uuid);
        html += '<option value="hunter:' + h.uuid + '"' + (sel ? " selected" : "") + ">" +
          escapeHtml(h.name) + (notAttending ? " (ej anmäld)" : "") + "</option>";
      });
    html += "</optgroup>";
    html += '<option value="freeform"' + (pa.assigneeType === "freeform" ? " selected" : "") +
      ">✎ Skriv in namn…</option>";
    return html;
  }

  // ---- Deltagare (attendees): narrows the Jägare list above to just the
  // hunters actually at this hunt, instead of the whole catalog. Backed by
  // state.eventAttendees (a plain array of Hunter uuids) so it round-trips
  // through the JSON like everything else. Toggling a checkbox re-renders
  // (cheap, and needed so the assignee dropdowns above pick up the change
  // right away); the filter box instead just shows/hides already-built
  // rows in place, so typing into it doesn't lose focus on every keystroke.
  function renderAttendeesBox() {
    const box = document.createElement("div");
    box.className = "attendee-box";

    const attendeeSet = new Set(state.eventAttendees || []);
    const header = document.createElement("div");
    header.className = "attendee-header";
    const countLabel = document.createElement("strong");
    countLabel.textContent = "Deltagare: " + attendeeSet.size + " av " + state.hunters.length;
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "btn small";
    toggleBtn.textContent = ui.attendeeBoxOpen ? "Dölj deltagarlista" : "Visa/redigera deltagare";
    toggleBtn.onclick = () => {
      ui.attendeeBoxOpen = !ui.attendeeBoxOpen;
      render();
    };
    const countWrap = document.createElement("span");
    countWrap.appendChild(countLabel);
    countWrap.insertAdjacentHTML("beforeend", helpBtn("attendees"));
    header.appendChild(countWrap);
    header.appendChild(toggleBtn);
    box.appendChild(header);

    if (ui.attendeeBoxOpen) {
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.style.margin = "8px 0";
      hint.textContent =
        "Kryssa i vilka jägare som är med på den här jaktdagen — bara de visas sen i Jägare-listan under Passfördelning. " +
        "Saknas någon helt? Skriv in namnet direkt på posten istället (\"✎ Skriv in namn…\" i Jägare-listan).";
      box.appendChild(hint);

      const filterInput = document.createElement("input");
      filterInput.type = "text";
      filterInput.className = "attendee-filter";
      filterInput.placeholder = "Filtrera namn…";
      filterInput.value = ui.attendeeFilter || "";
      box.appendChild(filterInput);

      const list = document.createElement("div");
      list.className = "attendee-list";

      function applyFilter() {
        const f = filterInput.value.trim().toLowerCase();
        list.querySelectorAll(".attendee-row").forEach((row) => {
          row.style.display = row.dataset.name.indexOf(f) === -1 ? "none" : "";
        });
      }

      [...state.hunters]
        .sort((a, b) => a.name.localeCompare(b.name, "sv"))
        .forEach((h) => {
          const row = document.createElement("label");
          row.className = "attendee-row";
          row.dataset.name = h.name.toLowerCase();
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = attendeeSet.has(h.uuid);
          cb.onchange = () => {
            const set = new Set(state.eventAttendees || []);
            if (cb.checked) set.add(h.uuid); else set.delete(h.uuid);
            state.eventAttendees = [...set];
            render();
          };
          row.appendChild(cb);
          row.appendChild(document.createTextNode(" " + h.name));
          list.appendChild(row);
        });

      box.appendChild(list);
      applyFilter();

      filterInput.oninput = () => {
        ui.attendeeFilter = filterInput.value;
        applyFilter();
      };
    }

    return box;
  }

  // ---- Report tab: printable assignment sheet, grouped by car ----

  function renderReport(app) {
    const wrap = document.createElement("div");

    const printBtn = document.createElement("button");
    printBtn.className = "btn primary no-print";
    printBtn.textContent = "Skriv ut / Spara som PDF";
    printBtn.style.marginBottom = "14px";
    printBtn.onclick = () => window.print();
    wrap.appendChild(printBtn);

    const root = document.createElement("div");
    root.id = "reportRoot";
    // "HuntType, Location — date" — huntType is omitted entirely when unset
    // rather than leaving a stray ", " in front of the location.
    const titleParts = [];
    if (state.event.huntType) titleParts.push(state.event.huntType);
    titleParts.push(state.event.locationName || "");
    const title = titleParts.join(", ") + " — " + (state.event.date || "");
    const headerHtml = "<h2>" + escapeHtml(title) + "</h2>";
    const imgSrc = locationImageSrc(state);
    if (imgSrc) {
      // Photo top-left, title centred beside it (mirrors the
      // native report). The <img> is set through the DOM, never HTML.
      const header = document.createElement("div");
      header.className = "report-header";
      header.innerHTML = "<h2>" + escapeHtml(title) + "</h2>";
      const img = document.createElement("img");
      img.className = "report-location-img";
      img.alt = "";
      let repairTried = false;
      img.onerror = () => {
        // Not decodable as is: maybe an Apple CgBI PNG (see above).
        if (repairTried) { img.remove(); return; }
        repairTried = true;
        repairAppleCgBiPng(imgSrc).then((fixed) => {
          if (fixed && img.isConnected) img.src = fixed;
          else img.remove();
        });
      };
      img.src = imgSrc;
      header.insertBefore(img, header.firstChild);
      root.appendChild(header);
    } else {
      root.innerHTML = headerHtml;
    }

    const grid = document.createElement("div");
    grid.className = "report-grid";

    orderedEventDrives().forEach((ed, idx) => {
      const block = document.createElement("div");
      block.className = "report-drive";
      const rally = ed.reassemblyPoint ? " — Återsamling: " + escapeHtml(ed.reassemblyPoint) : "";
      block.innerHTML = "<h3>Såt " + (idx + 1) + ": " + escapeHtml(ed.driveName) + rally + "</h3>";

      const groups = new Map();
      assignmentsForDrive(ed.localId).forEach((pa) => {
        const key = (pa.car || "").trim();
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(pa);
      });

      const keys = [...groups.keys()].sort((a, b) => {
        if (a === "" && b === "") return 0;
        if (a === "") return 1;
        if (b === "") return -1;
        return a.localeCompare(b, "sv", { numeric: true });
      });

      keys.forEach((key) => {
        const groupDiv = document.createElement("div");
        groupDiv.className = "report-group";
        groupDiv.innerHTML = "<h4>" + (key === "" ? "Utan fordon" : escapeHtml(key)) + "</h4>";
        groups.get(key).sort(comparePosts).forEach((pa) => {
          const post = findPost(pa.postNumber, pa.postCode) || { postNumber: pa.postNumber, code: pa.postCode };
          const row = document.createElement("div");
          row.className = "report-row";
          row.innerHTML =
            '<span class="rp">' + escapeHtml(reportLabel(post)) + "</span>" +
            '<span class="rn">' + escapeHtml(assigneeName(pa)) + "</span>" +
            '<span class="rc">' + escapeHtml(pa.comment || "") + "</span>";
          groupDiv.appendChild(row);
        });
        block.appendChild(groupDiv);
      });

      grid.appendChild(block);
    });

    root.appendChild(grid);
    wrap.appendChild(root);
    app.innerHTML = "";
    app.appendChild(wrap);
    fitReportPostColumn(root);
  }

  // Sizes the Rapport's post column to the widest label (e.g. "T82.5 (T)")
  // so a post never wraps onto a second line, while all rows still line up.
  // Needs the report in the document to measure, so it runs after append.
  function fitReportPostColumn(root) {
    const labels = root.querySelectorAll(".rp");
    let max = 0;
    labels.forEach((el) => {
      el.style.width = "max-content";
      max = Math.max(max, el.getBoundingClientRect().width);
      el.style.width = "";
    });
    if (max > 0) root.style.setProperty("--rp-w", Math.ceil(max) + 2 + "px");
  }

  // ---------- misc ----------

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
    }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function loadSample() {
    fetch("sample-event.json")
      .then((r) => r.json())
      .then(loadPackage)
      .catch((e) => alert("Kunde inte läsa exempeldata: " + e.message));
  }

  // ---------- wiring ----------

  document.getElementById("openBtn").onclick = () => document.getElementById("fileInput").click();
  document.getElementById("fileInput").onchange = (e) => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  };
  document.getElementById("saveBtn").onclick = exportPackage;
  document.querySelectorAll("nav.tabs button").forEach((b) => {
    b.onclick = () => {
      ui.tab = b.dataset.tab;
      ui.editingPost = null;
      render();
    };
  });

  document.getElementById("shareLinkBtn").onclick = async () => {
    const btn = document.getElementById("shareLinkBtn");
    const box = document.getElementById("shareBox");
    const input = document.getElementById("shareLinkInput");
    const status = document.getElementById("shareLinkStatus");
    btn.disabled = true;
    status.textContent = "";
    try {
      const url = dropbox ? dropboxLinkUrl(dropbox.token) : shareLinkUrl(await encodeStateForLink(withoutLocationImage(state)));
      input.value = url;
      box.classList.add("visible");
      input.focus();
      input.select();
      if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(url);
          status.textContent = "Länk kopierad!";
        } catch (e) {
          status.textContent = "Markerad — kopiera med Ctrl/Cmd+C";
        }
      } else {
        status.textContent = "Markerad — kopiera med Ctrl/Cmd+C";
      }
    } catch (e) {
      alert("Kunde inte skapa länken: " + e.message);
    } finally {
      btn.disabled = false;
    }
  };

  // "Skicka in" for a drop box hunt; the old email route otherwise (and as
  // the drop box's fallback when it can't be reached).
  document.getElementById("sendBackBtn").onclick = async () => {
    if (dropbox) {
      await sendToDropbox();
      return;
    }
    const btn = document.getElementById("sendBackBtn");
    btn.disabled = true;
    try {
      await sendBackByEmail("");
    } finally {
      btn.disabled = false;
    }
  };

  async function sendBackByEmail(statusPrefix) {
    const box = document.getElementById("shareBox");
    const input = document.getElementById("shareLinkInput");
    const status = document.getElementById("shareLinkStatus");
    status.textContent = "";
    try {
      // A mailto: link can only pre-fill a subject/body, never attach a
      // file — browsers don't allow a webpage to attach files to an email
      // on its own. So instead of relying only on the encoded link in the
      // body (which can get long), download the edited data as a JSON
      // file under a recognizable name and ask the editor to attach that
      // file to the email that's about to open. The link is still shown
      // and included as a fallback, same as "Dela länk…" already does,
      // in case attaching the file is inconvenient (e.g. on a phone).
      const filename = suggestedFileName(state);
      downloadJsonPackage(filename);

      // A drop box hunt's link is the short #h= one; the long #d= link is
      // only for hunts that have no drop box.
      const url = dropbox ? dropboxLinkUrl(dropbox.token) : shareLinkUrl(await encodeStateForLink(withoutLocationImage(state)));
      input.value = url;
      box.classList.add("visible");
      input.focus();
      input.select();
      const subject = "Uppdaterad jaktdag: " +
        (state.event.locationName || "Okänd plats") + " — " + (state.event.date || "");
      const body =
        "Filen med mina ändringar (" + filename + ") har laddats ner till den här datorn.\n" +
        "Bifoga den filen här i mejlet innan du skickar.\n\n" +
        "Går det inte att bifoga filen? Den här länken fungerar också:\n" + url + "\n";
      window.location.href =
        "mailto:" + encodeURIComponent(OWNER_EMAIL) +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);
      status.textContent = statusPrefix +
        "Fil nedladdad (" + filename + ") och e-post öppnad — bifoga filen och skicka. " +
        "Länken nedan fungerar också om det är enklare.";
    } catch (e) {
      alert("Kunde inte skapa länken: " + e.message);
    }
  }

  document.getElementById("fetchLatestBtn").onclick = () => {
    if (dropbox) fetchLatest(dropbox.token, { confirmIfDirty: true, keepTab: true });
  };
  document.getElementById("bannerFetchBtn").onclick = () => {
    if (dropbox) fetchLatest(dropbox.token, { confirmIfDirty: true, keepTab: true });
  };
  document.getElementById("bannerSaveFileBtn").onclick = () => {
    if (state) downloadJsonPackage(suggestedFileName(state));
  };

  document.getElementById("closeShareLinkBtn").onclick = () => {
    document.getElementById("shareBox").classList.remove("visible");
  };

  // A link generated by "Dela länk…" carries the hunt data in the
  // #fragment; if we were opened via one, load it before the first render
  // so the person just sees their data, not the empty-state screen.
  // No share-link hash to load? Check for a same-device autosave before
  // falling back to the empty state, so reopening the page (or refreshing
  // it) resumes automatically instead of losing whatever was on screen.
  function tryResumeAutosave() {
    const saved = readAutosaveSlot();
    if (!saved) {
      render();
      return;
    }
    decodeStateFromLink(saved.encoded)
      .then((pkg) => {
        loadPackage(pkg, saved.dropbox);
        if (dropbox) checkMeta();
      })
      .catch(() => {
        // corrupted autosave — don't block the app over it, just start clean
        render();
      });
  }

  // #h=<token>: the drop box. If this browser already has unsent edits for
  // the same token, keep them (and just check whether someone else has
  // pushed since); otherwise fetch the newest version.
  async function openDropboxLink(token) {
    const saved = readAutosaveSlot();
    if (saved && saved.dropbox && saved.dropbox.token === token) {
      try {
        const pkg = await decodeStateFromLink(saved.encoded);
        loadPackage(pkg, saved.dropbox);
        if (isDirty()) {
          setDropboxStatus("");
          checkMeta();
          return;
        }
      } catch (e) {
        // unreadable slot — fall through to a fresh fetch
      }
    }
    await fetchLatest(token, { keepTab: !!state });
    if (!state) render();
  }

  // A #d= link never carries the Location photo (see withoutLocationImage),
  // so a reload from the address-bar checkpoint would lose it. If this
  // browser's autosave slot holds the same hunt (same eventUUID) with a
  // photo, take the photo from there.
  async function restoreLocationImageFromSlot(pkg) {
    try {
      if (!pkg || pkg.locationImageDataURL || !pkg.eventUUID) return pkg;
      const saved = readAutosaveSlot();
      if (!saved) return pkg;
      const slotPkg = await decodeStateFromLink(saved.encoded);
      if (slotPkg && slotPkg.eventUUID === pkg.eventUUID && locationImageSrc(slotPkg)) {
        pkg.locationImageDataURL = slotPkg.locationImageDataURL;
      }
    } catch (e) {
      // best-effort: no photo is a normal state
    }
    return pkg;
  }

  function init() {
    const hash = location.hash;
    if (hash && hash.indexOf("#h=") === 0) {
      const token = hash.slice(3);
      if (TOKEN_RE.test(token)) {
        openDropboxLink(token);
      } else {
        alert("Länken är ofullständig (fel längd på koden). Be om en ny länk.");
        tryResumeAutosave();
      }
    } else if (hash && hash.indexOf("#d=") === 0) {
      decodeStateFromLink(hash.slice(3))
        .then(restoreLocationImageFromSlot)
        .then(loadPackage)
        .catch((e) => {
          alert("Kunde inte läsa länkens data: " + e.message);
          tryResumeAutosave();
        });
    } else {
      tryResumeAutosave();
    }
  }
  init();
})();
</script>
</body>
