  function assigneeOptions(pa) {
    let html = '<option value=""' + (pa.assigneeType == null ? " selected" : "") + ">Ej tilldelad</option>";
    // Same car today: for a pass in a real car, the unplaced hunters whose day
    // car is this car (and whoever already stands here) come first.
    const passCar = carKey(pa.car);
    const topUuids = new Set();
    if (sameCarOn() && passCar && countsAsCar(passCar)) {
      const placed = new Set(
        state.postAssignments
          .filter((x) => x !== pa && x.eventDriveLocalId === pa.eventDriveLocalId && x.assigneeType === "hunter" && x.hunterUUID)
          .map((x) => x.hunterUUID)
      );
      const attendeesNow = new Set(state.eventAttendees || []);
      const top = state.hunters
        .filter((h) => {
          const here = pa.assigneeType === "hunter" && pa.hunterUUID === h.uuid;
          if (!attendeesNow.has(h.uuid) && !here) return false;
          if (dayCarFor(h.uuid) !== passCar) return false;
          return here || !placed.has(h.uuid);
        })
        .sort((a, b) => a.name.localeCompare(b.name, "sv"));
      if (top.length) {
        html += '<optgroup label="' + escapeAttr(passCar) + ' — samma bil i dag">';
        top.forEach((h) => {
          topUuids.add(h.uuid);
          const sel = pa.assigneeType === "hunter" && pa.hunterUUID === h.uuid;
          html += '<option value="hunter:' + h.uuid + '"' + (sel ? " selected" : "") + ">" + escapeHtml(h.name) + "</option>";
        });
        html += "</optgroup>";
      }
    }
    html += '<optgroup label="Funktionsroll">';
    ROLES.forEach((r) => {
      const sel = pa.assigneeType === "role" && pa.role === r;
      html += '<option value="role:' + r + '"' + (sel ? " selected" : "") + ">" + r + "</option>";
    });
    html += "</optgroup>";
    html += '<optgroup label="Jägare">';
    // Only today's attendees (see the Deltagare box) show up here — not
    // the whole Hunter catalog — so this list stays short and relevant.
    // A hunter already assigned here is always kept, even if they've
    // since been unchecked as an attendee, so an existing assignment
    // never silently loses its label.
    const attendeeSet = new Set(state.eventAttendees || []);
    [...state.hunters]
      .filter((h) => !topUuids.has(h.uuid))
      .filter((h) => attendeeSet.has(h.uuid) || (pa.assigneeType === "hunter" && pa.hunterUUID === h.uuid))
      .sort((a, b) => a.name.localeCompare(b.name, "sv"))
      .forEach((h) => {
        const sel = pa.assigneeType === "hunter" && pa.hunterUUID === h.uuid;
        const notAttending = !attendeeSet.has(h.uuid);
        // Their own car, when it isn't this pass's car (an <option> can't be grey).
        const day = sameCarOn() ? dayCarFor(h.uuid) : null;
        const dayNote = day && day !== passCar ? " (" + day + ")" : "";
        html += '<option value="hunter:' + h.uuid + '"' + (sel ? " selected" : "") + ">" +
          escapeHtml(h.name) + escapeHtml(dayNote) + (notAttending ? " (ej anmäld)" : "") + "</option>";
      });
    html += "</optgroup>";
    html += '<option value="freeform"' + (pa.assigneeType === "freeform" ? " selected" : "") +
      ">✎ Skriv in namn…</option>";
    return html;
  }

  // ---- Deltagare (attendees): narrows the Jägare list above to just the
  // hunters actually at this hunt, instead of the whole catalog. Backed by
  // state.eventAttendees (a plain array of Hunter uuids) so it round-trips
  // through the JSON like everything else. Toggling a checkbox re-renders
  // (cheap, and needed so the assignee dropdowns above pick up the change
  // right away); the filter box instead just shows/hides already-built
  // rows in place, so typing into it doesn't lose focus on every keystroke.
  // "Bil för dagen" for one attendee: their car in grey plus a chooser
  // ("Automatiskt (Buss 1)" or one of the real cars).
  function dayCarControl(h) {
    const wrap = document.createElement("span");
    wrap.className = "attendee-daycar";
    const map = state.eventAttendeeDayCars;
    const hand = carKey(map[h.uuid]);
    const auto = derivedDayCar(h.uuid);
    const sel = document.createElement("select");
    sel.className = "daycar-sel";
    sel.title = "Bil för dagen";
    sel.setAttribute("aria-label", "Bil för dagen för " + h.name);
    sel.onclick = (e) => e.stopPropagation();
    const o0 = document.createElement("option");
    o0.value = "";
    o0.textContent = "Automatiskt (" + (auto || "ingen") + ")";
    sel.appendChild(o0);
    const cars = realCarNames();
    if (hand && cars.indexOf(hand) === -1) cars.push(hand);
    cars.forEach((c) => {
      const o = document.createElement("option");
      o.value = c;
      o.textContent = c;
      sel.appendChild(o);
    });
    sel.value = hand || "";
    sel.onchange = () => {
      if (sel.value === "") delete map[h.uuid];
      else map[h.uuid] = sel.value;
      scheduleAutosave();
      render();
    };
    wrap.appendChild(sel);
    return wrap;
  }

  function renderAttendeesBox() {
    const box = document.createElement("div");
    box.className = "attendee-box";

    const attendeeSet = new Set(state.eventAttendees || []);
    const header = document.createElement("div");
    header.className = "attendee-header";
    const countLabel = document.createElement("strong");
    countLabel.textContent = "Deltagare: " + attendeeSet.size + " av " + state.hunters.length;
    const toggleBtn = document.createElement("button");
    toggleBtn.className = "btn small";
    toggleBtn.textContent = ui.attendeeBoxOpen ? "Dölj deltagarlista" : "Visa/redigera deltagare";
    toggleBtn.onclick = () => {
      ui.attendeeBoxOpen = !ui.attendeeBoxOpen;
      render();
    };
    const countWrap = document.createElement("span");
    countWrap.appendChild(countLabel);
    countWrap.insertAdjacentHTML("beforeend", helpBtn("attendees"));
    header.appendChild(countWrap);
    header.appendChild(toggleBtn);
    box.appendChild(header);

    if (ui.attendeeBoxOpen) {
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.style.margin = "8px 0";
      hint.textContent =
        "Kryssa i vilka jägare som är med på den här jaktdagen — bara de visas sen i Jägare-listan under Passfördelning. " +
        "Saknas någon helt? Skriv in namnet direkt på posten istället (\"✎ Skriv in namn…\" i Jägare-listan).";
      box.appendChild(hint);

      const filterInput = document.createElement("input");
      filterInput.type = "text";
      filterInput.className = "attendee-filter";
      filterInput.placeholder = "Filtrera namn…";
      filterInput.value = ui.attendeeFilter || "";
      box.appendChild(filterInput);

      const list = document.createElement("div");
      list.className = "attendee-list" + (sameCarOn() ? " with-daycar" : "");

      function applyFilter() {
        const f = filterInput.value.trim().toLowerCase();
        list.querySelectorAll(".attendee-row").forEach((row) => {
          row.style.display = row.dataset.name.indexOf(f) === -1 ? "none" : "";
        });
      }

      [...state.hunters]
        .sort((a, b) => a.name.localeCompare(b.name, "sv"))
        .forEach((h) => {
          const row = document.createElement("label");
          row.className = "attendee-row";
          row.dataset.name = h.name.toLowerCase();
          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = attendeeSet.has(h.uuid);
          cb.onchange = () => {
            const set = new Set(state.eventAttendees || []);
            if (cb.checked) set.add(h.uuid); else set.delete(h.uuid);
            state.eventAttendees = [...set];
            render();
          };
          row.appendChild(cb);
          row.appendChild(document.createTextNode(" " + h.name));
          if (sameCarOn() && attendeeSet.has(h.uuid)) row.appendChild(dayCarControl(h));
          list.appendChild(row);
        });

      box.appendChild(list);
      applyFilter();

      filterInput.oninput = () => {
        ui.attendeeFilter = filterInput.value;
        applyFilter();
      };
    }

    return box;
  }

  // ---- Report tab: printable assignment sheet, grouped by car ----

  // One drive's assignments grouped by car, in report order: cars sorted
  // numeric-aware with "no car" last, rows inside a car by Ordning i bil.
  // Shared by the Rapport and the Mobilrapport so they can never disagree.
  function reportGroupsForDrive(ed) {
    const groups = new Map();
    assignmentsForDrive(ed.localId).forEach((pa) => {
      const key = (pa.car || "").trim();
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(pa);
    });
    const keys = [...groups.keys()].sort((a, b) => {
      if (a === "" && b === "") return 0;
      if (a === "") return 1;
      if (b === "") return -1;
      return a.localeCompare(b, "sv", { numeric: true });
    });
    return keys.map((key) => ({ key: key, items: groups.get(key).slice().sort(compareInCar) }));
  }

  function reportTitle() {
    const titleParts = [];
    if (state.event.huntType) titleParts.push(state.event.huntType);
    titleParts.push(state.event.locationName || "");
    return titleParts.join(", ") + " — " + formatDate(state.event.date);
  }

  // Mobilrapport: same content as the Rapport as a single column for a phone.
  // Its CSS lives here (not in the page <style>) because the downloadable
  // standalone file embeds exactly the same rules.
  const MOBILE_REPORT_CSS = `
  #mobileReport { max-width: 560px; margin: 0 auto; font-size: 16px; line-height: 1.35; }
  #mobileReport h2 { font-size: 22px; margin: 4px 0 14px; text-align: center; }
  #mobileReport .m-drive { margin-bottom: 22px; }
  #mobileReport .m-drive h3 {
    font-size: 17px;
    margin: 0 0 6px;
    padding-bottom: 3px;
    border-bottom: 1px solid var(--accent);
  }
  #mobileReport .m-drive h4 { font-size: 16px; font-style: italic; font-weight: 400; margin: 10px 0 2px; }
  #mobileReport .m-row {
    display: grid;
    grid-template-columns: var(--m-pw, 4.2em) 1fr;
    column-gap: 10px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  #mobileReport .m-row .rp { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  #mobileReport .m-row .rc { grid-column: 2; color: var(--muted); font-size: 14px; }
  #mobileReport .m-empty { color: var(--muted); font-size: 14px; margin: 4px 0; }
  #mobileReport .m-foot { margin: 18px 0 0; color: var(--muted); font-size: 13px; text-align: center; }
`;
  const mobileStyle = document.createElement("style");
  mobileStyle.textContent = MOBILE_REPORT_CSS;
  document.head.appendChild(mobileStyle);

  function buildMobileReport() {
    const root = document.createElement("div");
    root.id = "mobileReport";
    const h2 = document.createElement("h2");
    h2.textContent = reportTitle();
    root.appendChild(h2);
    orderedEventDrives().forEach((ed, idx) => {
      const block = document.createElement("section");
      block.className = "m-drive";
      const h3 = document.createElement("h3");
      h3.textContent = "Såt " + (idx + 1) + ": " + ed.driveName +
        (ed.reassemblyPoint ? " — Återsamling: " + ed.reassemblyPoint : "");
      block.appendChild(h3);
      const groups = reportGroupsForDrive(ed);
      if (!groups.length) {
        const e = document.createElement("div");
        e.className = "m-empty";
        e.textContent = "Inga pass.";
        block.appendChild(e);
      }
      groups.forEach(({ key, items }) => {
        const h4 = document.createElement("h4");
        h4.textContent = key === "" ? "Utan fordon" : key;
        block.appendChild(h4);
        items.forEach((pa) => {
          const post = findPost(pa.postNumber, pa.postCode) || { postNumber: pa.postNumber, code: pa.postCode };
          const row = document.createElement("div");
          row.className = "m-row";
          const rp = document.createElement("span"); rp.className = "rp"; rp.textContent = reportLabel(post);
          const rn = document.createElement("span"); rn.className = "rn"; rn.textContent = assigneeName(pa, true);
          row.appendChild(rp); row.appendChild(rn);
          if (pa.comment) {
            const rc = document.createElement("span"); rc.className = "rc"; rc.textContent = pa.comment;
            row.appendChild(rc);
          }
          block.appendChild(row);
        });
      });
      root.appendChild(block);
    });
    return root;
  }

  // Post column as wide as the widest label so names line up in every row.
  // Needs the report to be in the document to measure.
  function fitMobileColumn(root) {
    let max = 0;
    root.querySelectorAll(".m-row .rp").forEach((el) => {
      el.style.width = "max-content";
      max = Math.max(max, el.getBoundingClientRect().width);
      el.style.width = "";
    });
    if (max > 0) root.style.setProperty("--m-pw", Math.ceil(max) + 2 + "px");
  }

  function renderMobileReport(app) {
    const wrap = document.createElement("div");
    const bar = document.createElement("div");
    bar.className = "no-print";
    bar.style.cssText = "max-width:560px;margin:0 auto 14px;";
    const dl = document.createElement("button");
    dl.className = "btn primary";
    dl.textContent = "Ladda ner som fil";
    dl.onclick = downloadMobileReport;
    const hint = document.createElement("div");
    hint.style.cssText = "color:var(--muted);font-size:13px;margin-top:6px;";
    hint.textContent = "En fil att skicka till deltagarna. Den fungerar utan uppkoppling och visar läget just nu; ändrar du något efteråt behöver du skicka en ny.";
    bar.appendChild(dl);
    bar.appendChild(hint);
    wrap.appendChild(bar);
    const root = buildMobileReport();
    wrap.appendChild(root);
    app.innerHTML = "";
    app.appendChild(wrap);
    fitMobileColumn(root);
  }

  function mobileReportFileName() {
    const parts = [];
    if (state.event.locationName) parts.push(state.event.locationName);
    if (state.event.date) parts.push(state.event.date);
    const slug = parts.join("-").normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
    return "rapport-" + (slug || "jaktdag") + ".html";
  }

  // The whole report as one self-contained HTML document: inline CSS, no
  // script, no external requests, so it opens offline on any phone.
  function buildMobileReportFile() {
    const holder = document.createElement("div");
    holder.style.cssText = "position:absolute;left:-9999px;top:0;width:480px;visibility:hidden;";
    const root = buildMobileReport();
    const foot = document.createElement("p");
    foot.className = "m-foot";
    const now = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    foot.textContent = "Sammanställd " + formatDate(now.getFullYear() + "-" + pad(now.getMonth() + 1) + "-" + pad(now.getDate())) +
      " " + pad(now.getHours()) + ":" + pad(now.getMinutes()) + ".";
    root.appendChild(foot);
    holder.appendChild(root);
    document.body.appendChild(holder);
    fitMobileColumn(root);
    const html = root.outerHTML;
    holder.remove();
    return "<!doctype html>\n<html lang=\"sv\"><head><meta charset=\"utf-8\">" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">" +
      "<title>" + escapeHtml(reportTitle()) + "</title><style>" +
      ":root{--accent:#2e5e3e;--border:#d8d8d8;--muted:#6b6b6b;color-scheme:light dark}" +
      "body{margin:0;padding:14px;background:#fff;color:#1c1c1c;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Helvetica,Arial,sans-serif}" +
      "@media(prefers-color-scheme:dark){:root{--accent:#7fbf94;--border:#3a3a3a;--muted:#a0a0a0}body{background:#111;color:#eee}}" +
      MOBILE_REPORT_CSS + "</style></head><body>" + html + "</body></html>\n";
  }

  function downloadMobileReport() {
    const blob = new Blob([buildMobileReportFile()], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = mobileReportFileName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function renderReport(app) {
    const wrap = document.createElement("div");

    const printBtn = document.createElement("button");
    printBtn.className = "btn primary no-print";
    printBtn.textContent = "Skriv ut / Spara som PDF";
    printBtn.style.marginBottom = "14px";
    printBtn.onclick = () => window.print();
    wrap.appendChild(printBtn);

    const root = document.createElement("div");
    root.id = "reportRoot";
    // "HuntType, Location — date" — huntType is omitted entirely when unset
    // rather than leaving a stray ", " in front of the location.
    const title = reportTitle();
    const headerHtml = "<h2>" + escapeHtml(title) + "</h2>";
    const imgSrc = locationImageSrc(state);
    if (imgSrc) {
      // Photo top-left, title centred beside it (mirrors the
      // native report). The <img> is set through the DOM, never HTML.
      const header = document.createElement("div");
      header.className = "report-header";
      header.innerHTML = "<h2>" + escapeHtml(title) + "</h2>";
      const img = document.createElement("img");
      img.className = "report-location-img";
      img.alt = "";
      let repairTried = false;
      img.onerror = () => {
        // Not decodable as is: maybe an Apple CgBI PNG (see above).
        if (repairTried) { img.remove(); return; }
        repairTried = true;
        repairAppleCgBiPng(imgSrc).then((fixed) => {
          if (fixed && img.isConnected) img.src = fixed;
          else img.remove();
        });
      };
      img.src = imgSrc;
      header.insertBefore(img, header.firstChild);
      root.appendChild(header);
    } else {
      root.innerHTML = headerHtml;
    }

    const grid = document.createElement("div");
    grid.className = "report-grid";

    orderedEventDrives().forEach((ed, idx) => {
      const block = document.createElement("div");
      block.className = "report-drive";
      const rally = ed.reassemblyPoint ? " — Återsamling: " + escapeHtml(ed.reassemblyPoint) : "";
      block.innerHTML = "<h3>Såt " + (idx + 1) + ": " + escapeHtml(ed.driveName) + rally + "</h3>";

      reportGroupsForDrive(ed).forEach(({ key, items }) => {
        const groupDiv = document.createElement("div");
        groupDiv.className = "report-group";
        groupDiv.innerHTML = "<h4>" + (key === "" ? "Utan fordon" : escapeHtml(key)) + "</h4>";
        items.forEach((pa) => {
          const post = findPost(pa.postNumber, pa.postCode) || { postNumber: pa.postNumber, code: pa.postCode };
          const row = document.createElement("div");
          row.className = "report-row";
          row.innerHTML =
            '<span class="rp">' + escapeHtml(reportLabel(post)) + "</span>" +
            '<span class="rn">' + escapeHtml(assigneeName(pa, true)) + "</span>" +
            '<span class="rc">' + escapeHtml(pa.comment || "") + "</span>";
          groupDiv.appendChild(row);
        });
        block.appendChild(groupDiv);
      });

      grid.appendChild(block);
    });

    root.appendChild(grid);
    wrap.appendChild(root);
    app.innerHTML = "";
    app.appendChild(wrap);
    fitReportPostColumn(root);
  }

  // Sizes the Rapport's post column to the widest label (e.g. "T82.5 (T)")
  // so a post never wraps onto a second line, while all rows still line up.
  // Needs the report in the document to measure, so it runs after append.
  function fitReportPostColumn(root) {
    const labels = root.querySelectorAll(".rp");
    let max = 0;
    labels.forEach((el) => {
      el.style.width = "max-content";
      max = Math.max(max, el.getBoundingClientRect().width);
      el.style.width = "";
    });
    if (max > 0) root.style.setProperty("--rp-w", Math.ceil(max) + 2 + "px");
  }

  // ---------- misc ----------

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;",
    }[c]));
  }
  function escapeAttr(s) { return escapeHtml(s); }

  function loadSample() {
    fetch("sample-event.json")
      .then((r) => r.json())
      .then(loadPackage)
      .catch((e) => alert("Kunde inte läsa exempeldata: " + e.message));
  }

  // ---------- wiring ----------

  document.getElementById("openBtn").onclick = () => document.getElementById("fileInput").click();
  document.getElementById("fileInput").onchange = (e) => {
    if (e.target.files[0]) handleFile(e.target.files[0]);
  };
  document.getElementById("saveBtn").onclick = exportPackage;
  document.querySelectorAll("nav.tabs button").forEach((b) => {
    b.onclick = () => {

  document.getElementById("shareLinkBtn").onclick = async () => {
    const btn = document.getElementById("shareLinkBtn");
    const box = document.getElementById("shareBox");
    const input = document.getElementById("shareLinkInput");
    const status = document.getElementById("shareLinkStatus");
    btn.disabled = true;
    status.textContent = "";
    try {
      const url = dropbox ? dropboxLinkUrl(dropbox.token) : shareLinkUrl(await encodeStateForLink(withoutLocationImage(state)));
      input.value = url;
      box.classList.add("visible");
      input.focus();
      input.select();
      if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(url);
          status.textContent = "Länk kopierad!";
        } catch (e) {
          status.textContent = "Markerad — kopiera med Ctrl/Cmd+C";
        }
      } else {
        status.textContent = "Markerad — kopiera med Ctrl/Cmd+C";
      }
    } catch (e) {
      alert("Kunde inte skapa länken: " + e.message);
    } finally {
      btn.disabled = false;
    }
  };

  // "Skicka in" for a drop box hunt; the old email route otherwise (and as
  // the drop box's fallback when it can't be reached).
  document.getElementById("sendBackBtn").onclick = async () => {
    if (dropbox) {
      await sendToDropbox();
      return;
    }
    const btn = document.getElementById("sendBackBtn");
    btn.disabled = true;
    try {
      await sendBackByEmail("");
    } finally {
      btn.disabled = false;
    }

  async function sendBackByEmail(statusPrefix) {
    const box = document.getElementById("shareBox");
    const input = document.getElementById("shareLinkInput");
    const status = document.getElementById("shareLinkStatus");
    status.textContent = "";
    try {
      // A mailto: link can only pre-fill a subject/body, never attach a
      // file — browsers don't allow a webpage to attach files to an email
      // on its own. So instead of relying only on the encoded link in the
      // body (which can get long), download the edited data as a JSON
      // file under a recognizable name and ask the editor to attach that
      // file to the email that's about to open. The link is still shown
      // and included as a fallback, same as "Dela länk…" already does,
      // in case attaching the file is inconvenient (e.g. on a phone).
      const filename = suggestedFileName(state);
      downloadJsonPackage(filename);

      // A drop box hunt's link is the short #h= one; the long #d= link is
      // only for hunts that have no drop box.
      const url = dropbox ? dropboxLinkUrl(dropbox.token) : shareLinkUrl(await encodeStateForLink(withoutLocationImage(state)));
      input.value = url;
      box.classList.add("visible");
      input.focus();
      input.select();
      const subject = "Uppdaterad jaktdag: " +
        (state.event.locationName || "Okänd plats") + " — " + formatDate(state.event.date);
      const body =
        "Filen med mina ändringar (" + filename + ") har laddats ner till den här datorn.\n" +
        "Bifoga den filen här i mejlet innan du skickar.\n\n" +
        "Går det inte att bifoga filen? Den här länken fungerar också:\n" + url + "\n";
      window.location.href =
        "mailto:" + encodeURIComponent(OWNER_EMAIL) +
        "?subject=" + encodeURIComponent(subject) +
        "&body=" + encodeURIComponent(body);
      status.textContent = statusPrefix +
        "Fil nedladdad (" + filename + ") och e-post öppnad — bifoga filen och skicka. " +
        "Länken nedan fungerar också om det är enklare.";
    } catch (e) {
      alert("Kunde inte skapa länken: " + e.message);
    }
  }

  document.getElementById("fetchLatestBtn").onclick = () => {
    if (dropbox) fetchLatest(dropbox.token, { confirmIfDirty: true, keepTab: true });
  };
  document.getElementById("bannerFetchBtn").onclick = () => {
    if (dropbox) fetchLatest(dropbox.token, { confirmIfDirty: true, keepTab: true });
  };
  document.getElementById("bannerSaveFileBtn").onclick = () => {
    if (state) downloadJsonPackage(suggestedFileName(state));
  };

  document.getElementById("closeShareLinkBtn").onclick = () => {
    document.getElementById("shareBox").classList.remove("visible");
  };

  // A link generated by "Dela länk…" carries the hunt data in the
  // #fragment; if we were opened via one, load it before the first render
  // so the person just sees their data, not the empty-state screen.
  // No share-link hash to load? Check for a same-device autosave before
  // falling back to the empty state, so reopening the page (or refreshing
  // it) resumes automatically instead of losing whatever was on screen.
  function tryResumeAutosave() {
    const saved = readAutosaveSlot();
    if (!saved) {
      render();
      return;
    }
    decodeStateFromLink(saved.encoded)
      .then((pkg) => {
        loadPackage(pkg, saved.dropbox);
        if (dropbox) {
          ensureBaseForCleanState().then(checkMeta);
        }
      })
      .catch(() => {
        // corrupted autosave — don't block the app over it, just start clean
        render();
      });
  }

  // #h=<token>: the drop box. If this browser already has unsent edits for
  // the same token, keep them (and just check whether someone else has
  // pushed since); otherwise fetch the newest version.
  async function openDropboxLink(token) {
    const saved = readAutosaveSlot();
    if (saved && saved.dropbox && saved.dropbox.token === token) {
      try {
        const pkg = await decodeStateFromLink(saved.encoded);
        loadPackage(pkg, saved.dropbox);
        if (isDirty()) {
          setDropboxStatus("");
          checkMeta();
          return;
        }
      } catch (e) {
        // unreadable slot — fall through to a fresh fetch
      }
    }
    await fetchLatest(token, { keepTab: !!state });
    if (!state) render();
  }

  // A #d= link never carries the Location photo (see withoutLocationImage),
  // so a reload from the address-bar checkpoint would lose it. If this
  // browser's autosave slot holds the same hunt (same eventUUID) with a
  // photo, take the photo from there.
  async function restoreLocationImageFromSlot(pkg) {
    try {
      if (!pkg || pkg.locationImageDataURL || !pkg.eventUUID) return pkg;
      const saved = readAutosaveSlot();
      if (!saved) return pkg;
      const slotPkg = await decodeStateFromLink(saved.encoded);
      if (slotPkg && slotPkg.eventUUID === pkg.eventUUID && locationImageSrc(slotPkg)) {
        pkg.locationImageDataURL = slotPkg.locationImageDataURL;
      }
    } catch (e) {
      // best-effort: no photo is a normal state
    }
    return pkg;
  }

  function init() {
    const hash = location.hash;
    if (hash && hash.indexOf("#h=") === 0) {
      const token = hash.slice(3);
      if (TOKEN_RE.test(token)) {
        openDropboxLink(token);
      } else {
        alert("Länken är ofullständig (fel längd på koden). Be om en ny länk.");
        tryResumeAutosave();
      }
    } else if (hash && hash.indexOf("#d=") === 0) {
      decodeStateFromLink(hash.slice(3))
        .then(restoreLocationImageFromSlot)
        .then(loadPackage)
        .catch((e) => {
          alert("Kunde inte läsa länkens data: " + e.message);
          tryResumeAutosave();
        });
    } else {
      tryResumeAutosave();
    }
  }
  init();
})();
</script>
</body>
</html>
